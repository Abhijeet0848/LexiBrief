name: LexiBrief CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Continuous Integration (Syntax, Code Quality, Test Verification)
  ci-pipeline:
    name: Code Validation & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Test Framework
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r requirements.txt || true
          pip install -e . || true

      - name: Validate Python Syntax & Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,research,artifacts,dist

      - name: Run Test Suite
        env:
          PYTHONPATH: src:.
        run: |
          pytest tests/test_accuracy.py -v

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiBrief - Text Summarizer</title>
  <meta name="description" content="Text Summarizer powered by Extractive TF-IDF & Deep Transformers with live MongoDB Cloud persistence." />

  <link rel="icon" type="image/jpeg" href="/static/logo.jpg" />
  <link rel="apple-touch-icon" href="/static/logo.jpg" />

  <!-- Premium Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            heading: ['"Outfit"', '"Plus Jakarta Sans"', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
    }
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-overflow-scrolling: touch;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    /* GPU Hardware Acceleration for smooth scrolling & no jank */
    .gpu-layer {
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
    }
    /* Premium custom smooth scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
      transition: background-color 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }
    .card-shadow {
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
    }
    .card-shadow-md {
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    }
    textarea {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      letter-spacing: -0.01em;
      scroll-behavior: smooth;
    }
    ::placeholder {
      color: #94a3b8 !important;
      opacity: 1 !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 3D Modern Tactile Buttons & Interactive Elements */
    .btn-3d-primary {
      position: relative;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #7c3aed 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 3.5px solid #3730a3;
      box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.35), 0 2px 4px rgba(15, 23, 42, 0.1);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .btn-3d-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -2px rgba(99, 102, 241, 0.5), 0 4px 8px rgba(15, 23, 42, 0.15);
      border-bottom: 4.5px solid #312e81;
      filter: brightness(1.06);
    }
    .btn-3d-primary:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom: 1.5px solid #3730a3;
      box-shadow: 0 2px 6px -1px rgba(79, 70, 229, 0.3);
    }
    .btn-3d-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: skewX(-20deg);
      pointer-events: none;
    }
    .btn-3d-primary:hover:not(:disabled)::after {
      left: 180%;
      transition: left 0.75s ease-in-out;
    }

    /* 3D Secondary Button (Tactile Slate/White) */
    .btn-3d-secondary {
      position: relative;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom: 2.5px solid #cbd5e1;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-3d-secondary:hover:not(:disabled) {
      transform: translateY(-1.5px);
      border-color: #cbd5e1;
      border-bottom: 3.5px solid #94a3b8;
      box-shadow: 0 6px 14px -2px rgba(15, 23, 42, 0.08);
      color: #4f46e5;
    }
    .btn-3d-secondary:active:not(:disabled) {
      transform: translateY(1.5px);
      border-bottom: 1px solid #cbd5e1;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    /* 3D Nav Tabs & Interactive Pills */
    .tab-3d {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-3d:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
    }
    .tab-3d-active {
      background: #ffffff;
      border: 1px solid #e0e7ff;
      border-bottom: 2px solid #6366f1;
      box-shadow: 0 3px 8px -1px rgba(99, 102, 241, 0.2);
    }
  </style>
</head>
<body class="text-slate-900 antialiased selection:bg-indigo-600 selection:text-white min-h-screen relative overflow-x-hidden bg-slate-50">
  
  <!-- GPU-Accelerated Fixed Background Layer (Zero Scroll-Repaint Jank) -->
  <div id="bg-canvas" class="fixed inset-0 pointer-events-none -z-20 bg-cover bg-center bg-no-repeat gpu-layer" style="background-image: url('/static/background.jpg');"></div>
  
  <!-- Soft Ambient Overlay for Optimal Reading Contrast -->
  <div id="bg-overlay" class="fixed inset-0 pointer-events-none -z-10 bg-slate-50/70 gpu-layer"></div>

  <div id="root" class="relative z-10"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Toast Notification
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 3500);
        return () => clearTimeout(t);
      }, [onClose]);

      const bg = type === 'error' ? 'bg-rose-600 text-white' :
                 type === 'success' ? 'bg-emerald-600 text-white' :
                 'bg-slate-900 text-white';

      return (
        <div className={`fixed bottom-16 sm:bottom-5 right-3 sm:right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-medium ${bg} transition-all`}>
          <span>{message}</span>
          <button onClick={onClose} className="opacity-80 hover:opacity-100 font-bold ml-2">✕</button>
        </div>
      );
    }

    // Modern SVG Icons for Tabs & Action Buttons
    const SparklesIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/>
      </svg>
    );

    const DocumentIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    );

    const HistoryIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    );

    const ChartIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
    );

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('summarize');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Editor & Output State
      const [inputText, setInputText] = useState('');
      const [summaryResult, setSummaryResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Model & Persona Settings
      const [engineMethod, setEngineMethod] = useState('auto');
      const [modelChoice, setModelChoice] = useState('bart');
      const [summaryMode, setSummaryMode] = useState('balanced');
      const [persona, setPersona] = useState('general'); // 'general', 'executive', 'technical', 'eli5', 'action_items'

      // Multi-Source Ingestion & URL / YouTube State
      const [inputSourceTab, setInputSourceTab] = useState('text'); // 'text', 'upload', 'url'
      const [urlInput, setUrlInput] = useState('');
      const [urlLoading, setUrlLoading] = useState(false);
      const [urlDocData, setUrlDocData] = useState(null);

      // Explainable Source Attribution Highlighting State
      const [hoveredSummarySentenceIdx, setHoveredSummarySentenceIdx] = useState(null);
      const [selectedSummarySentenceIdx, setSelectedSummarySentenceIdx] = useState(null);
      const [showAttributionInspector, setShowAttributionInspector] = useState(false);
      const [sourceViewMode, setSourceViewMode] = useState('editor'); // 'editor', 'traceability'

      // Lists & Search
      const [summariesList, setSummariesList] = useState([]);
      const [documentsList, setDocumentsList] = useState([]);
      const [historySearch, setHistorySearch] = useState('');

      // Documents Tab Advanced States
      const [docSearch, setDocSearch] = useState('');
      const [docFormatFilter, setDocFormatFilter] = useState('ALL');
      const [docViewMode, setDocViewMode] = useState('grid');
      const [previewDoc, setPreviewDoc] = useState(null);
      const [previewLoading, setPreviewLoading] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const [uploadedDocInfo, setUploadedDocInfo] = useState(null);
      const [saveLoading, setSaveLoading] = useState(false);

      // Standalone ROUGE
      const [rougeRef, setRougeRef] = useState('');
      const [rougeCand, setRougeCand] = useState('');
      const [rougeScores, setRougeScores] = useState(null);
      const [rougeLoading, setRougeLoading] = useState(false);

      // Speech Synthesis & Studio Neural Voice State
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [audioLoading, setAudioLoading] = useState(false);
      const [selectedVoice, setSelectedVoice] = useState('neerja');
      const [voices, setVoices] = useState([]);
      const audioRef = useRef(null);

      const showToast = (msg, type = 'info') => setToast({ message: msg, type });

      useEffect(() => {
        fetchSummaries();
        fetchDocuments();

        // Populate fallback TTS voices
        const loadVoices = () => {
          if ('speechSynthesis' in window) {
            const list = window.speechSynthesis.getVoices();
            if (list && list.length > 0) {
              setVoices(list);
            }
          }
        };
        loadVoices();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        return () => {
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current = null;
          }
        };
      }, []);

      const fetchSummaries = async () => {
        try {
          const res = await fetch('/api/summaries?limit=50');
          if (res.ok) {
            const d = await res.json();
            setSummariesList(d.summaries || []);
          }
        } catch (e) {}
      };

      const fetchDocuments = async () => {
        try {
          const res = await fetch('/api/documents?limit=50');
          if (res.ok) {
            const d = await res.json();
            setDocumentsList(d.documents || []);
          }
        } catch (e) {}
      };

      // Document Helpers
      const openDocPreview = async (doc) => {
        setPreviewLoading(true);
        try {
          const res = await fetch(`/api/documents/${doc._id}`);
          if (res.ok) {
            const fullDoc = await res.json();
            setPreviewDoc(fullDoc);
          } else {
            setPreviewDoc(doc);
          }
        } catch (e) {
          setPreviewDoc(doc);
        } finally {
          setPreviewLoading(false);
        }
      };

      const exportDocTxt = (doc, e) => {
        e?.stopPropagation();
        const text = doc.text_content || doc.text_snippet || '';
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const name = doc.filename ? `${doc.filename.replace(/\.[^/.]+$/, "")}_extracted.txt` : 'document_text.txt';
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`Downloaded ${name}`, "success");
      };

      const handleSaveSummary = async () => {
        if (!summaryResult) return;
        setSaveLoading(true);
        try {
          const rawTitle = (uploadedDocInfo?.filename || inputText.split('\n')[0] || 'Document Summary')
            .replace(/[^\w\s.-]/gi, '')
            .trim();
          const title = rawTitle.length > 50 ? rawTitle.slice(0, 50) + '...' : rawTitle || 'Document Summary';

          const payload = {
            title: title,
            text: inputText,
            text_snippet: inputText.slice(0, 200),
            summary: summaryResult.summary,
            mode: summaryMode,
            method: engineMethod,
            method_used: summaryResult.method_used || `${engineMethod.toUpperCase()} (${modelChoice})`,
            model_name: modelChoice,
            model_source: summaryResult.model_source || modelChoice,
            key_points: summaryResult.key_points || [],
            keywords: summaryResult.keywords || [],
            nlp_stats: summaryResult.nlp_stats || stats,
            summary_stats: summaryResult.summary_stats || {},
            rouge: summaryResult.rouge || {},
            analytics: summaryResult.analytics || {
              original_words: stats.words,
              summary_words: summaryResult.summary.split(/\s+/).filter(Boolean).length,
              compression_ratio: `${Math.round(Math.max(0, 1 - (summaryResult.summary.split(/\s+/).filter(Boolean).length / Math.max(stats.words, 1))) * 100)}%`
            }
          };

          const res = await fetch('/api/summaries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error("Could not save to MongoDB");
          showToast("✓ Summary saved to MongoDB Atlas!", "success");
          fetchSummaries();
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setSaveLoading(false);
        }
      };

      const uploadFileObject = async (file) => {
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);

        setUploadLoading(true);
        try {
          const res = await fetch('/api/upload', { method: 'POST', body: formData });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || "Could not extract file text");
          }
          const data = await res.json();
          setInputText(data.text || '');
          setUploadedDocInfo({
            filename: data.filename,
            format: data.format || 'TXT',
            pages: data.pages || 1,
            words: data.words || data.stats?.words || 0
          });
          showToast(`Ingested ${data.filename} (${(data.words || 0).toLocaleString()} words)`, "success");
          fetchDocuments();
          setActiveTab('summarize');
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setUploadLoading(false);
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target?.files?.[0];
        if (!file) return;
        await uploadFileObject(file);
        e.target.value = '';
      };

      const handleDrop = async (e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer?.files?.[0];
        if (!file) return;
        await uploadFileObject(file);
      };

      // Ingested Documents Statistics
      const docStats = useMemo(() => {
        const total = documentsList.length;
        let words = 0;
        let pdf = 0;
        let docx = 0;
        let txt = 0;
        documentsList.forEach(d => {
          words += (d.words || 0);
          const f = (d.format || 'TXT').toUpperCase();
          if (f === 'PDF') pdf++;
          else if (f === 'DOCX') docx++;
          else txt++;
        });
        return { total, words, pdf, docx, txt };
      }, [documentsList]);

      // Filtered Documents List
      const filteredDocuments = useMemo(() => {
        return documentsList.filter(doc => {
          const matchesSearch = !docSearch.trim() || 
            (doc.filename && doc.filename.toLowerCase().includes(docSearch.toLowerCase())) ||
            (doc.text_snippet && doc.text_snippet.toLowerCase().includes(docSearch.toLowerCase()));
          const fmt = (doc.format || 'TXT').toUpperCase();
          const matchesFormat = docFormatFilter === 'ALL' || fmt === docFormatFilter;
          return matchesSearch && matchesFormat;
        });
      }, [documentsList, docSearch, docFormatFilter]);



      // URL / YouTube Content Ingestion Handler
      const handleFetchUrl = async (overrideUrl = null) => {
        const targetUrl = (typeof overrideUrl === 'string' && overrideUrl.trim()) ? overrideUrl.trim() : urlInput.trim();
        if (!targetUrl) {
          showToast("Please enter a valid web article URL or YouTube video link.", "error");
          return null;
        }

        if (typeof overrideUrl === 'string' && overrideUrl.trim()) {
          setUrlInput(overrideUrl.trim());
        }

        setUrlLoading(true);
        try {
          const res = await fetch('/api/fetch-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: targetUrl })
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || "Failed to fetch content from URL.");
          }

          const data = await res.json();
          setInputText(data.text || '');
          setUrlDocData(data);
          setUploadedDocInfo({
            filename: data.title || (data.format === 'YOUTUBE' ? 'YouTube Transcript' : 'Web Resource'),
            format: data.format || 'WEB_URL',
            pages: 1,
            words: data.words || data.stats?.words || 0
          });
          showToast(`✓ Ingested ${(data.format === 'YOUTUBE' ? 'YouTube video' : 'article')} "${(data.title || 'Web Resource').slice(0, 35)}..." (${(data.words || 0).toLocaleString()} words)`, "success");
          fetchDocuments();
          return data.text;
        } catch (err) {
          showToast(err.message, "error");
          return null;
        } finally {
          setUrlLoading(false);
        }
      };

      // Summarize with Persona and Attribution support
      const handleSummarize = async () => {
        let textToSummarize = inputText;
        
        // Auto-fetch if in URL tab and text is empty or unchanged but URL is present
        if ((!textToSummarize.trim() || !/[a-zA-Z0-9]/.test(textToSummarize)) && urlInput.trim()) {
          showToast("Fetching URL content before generating brief...", "info");
          textToSummarize = await handleFetchUrl(urlInput);
          if (!textToSummarize) return;
        }

        if (!textToSummarize || !textToSummarize.trim() || !/[a-zA-Z0-9]/.test(textToSummarize)) {
          showToast("Please enter text, upload a document, or fetch a URL.", "error");
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: textToSummarize,
              mode: summaryMode,
              method: engineMethod,
              model_name: modelChoice,
              persona: persona
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Summarization request failed");
          }

          const data = await res.json();
          setSummaryResult(data);
          setHoveredSummarySentenceIdx(null);
          setSelectedSummarySentenceIdx(null);
          showToast("Summary generated successfully!", "success");
          fetchSummaries();
        } catch (e) {
          showToast(e.message, "error");
        } finally {
          setIsLoading(false);
        }
      };

      // Delete Summary
      const handleDeleteSummary = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Delete this summary from history?")) return;
        try {
          const res = await fetch(`/api/summaries/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Summary removed.", "info");
            fetchSummaries();
          }
        } catch (err) {}
      };

      // Delete Document
      const handleDeleteDoc = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Delete this document?")) return;
        try {
          const res = await fetch(`/api/documents/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Document deleted.", "info");
            fetchDocuments();
          }
        } catch (err) {}
      };

      // Compute ROUGE
      const handleComputeRouge = async () => {
        if (!rougeRef.trim() || !rougeCand.trim()) {
          showToast("Please provide both reference text and candidate summary.", "error");
          return;

            showToast("ROUGE scores calculated successfully!", "success");

            showToast("ROUGE computation failed.", "error");
          }

        }

        setRougeCand("NLP enables machines to understand and generate human language. Transformer models like BART and Pegasus capture deep semantic context to produce fluent abstractive summaries with strong ROUGE scores.");
        showToast("Loaded sample evaluation pair!", "info");
      };

        setRougeRef('');
        setRougeCand('');
        setRougeScores(null);
        showToast("Cleared evaluator inputs.", "info");

      // Text to Speech with Studio Neural Indian Voice Audio Streaming
      const handleSpeak = async (text) => {
        if (!text || !text.trim()) return;

        // If audio is currently playing or loading, cancel/stop it
        if (isSpeaking || audioLoading) {
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current.currentTime = 0;
            audioRef.current = null;
          }
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          setIsSpeaking(false);
          setAudioLoading(false);
          return;
        }

        // Clean text of markdown bullet points and code artifacts for smooth, fluent narration
        const cleanText = text
          .replace(/[#*_`~>-]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        if (!cleanText) return;

        setAudioLoading(true);

        try {
          // Call Studio Neural backend TTS
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              text: cleanText,
              voice: selectedVoice
            })
          });

          if (!res.ok) {
            throw new Error(`TTS server response error: ${res.status}`);
          }

          const blob = await res.blob();
          const audioUrl = URL.createObjectURL(blob);
          const audio = new Audio(audioUrl);
          audioRef.current = audio;

          audio.onplay = () => {
            setIsSpeaking(true);
            setAudioLoading(false);
          };

          audio.onended = () => {
            setIsSpeaking(false);
            setAudioLoading(false);
            URL.revokeObjectURL(audioUrl);
            audioRef.current = null;
          };

          audio.onerror = () => {
            setIsSpeaking(false);
            setAudioLoading(false);
            URL.revokeObjectURL(audioUrl);
            audioRef.current = null;
            showToast("Audio playback encountered an error.", "error");
          };

          await audio.play();
          
          const voiceLabel = selectedVoice === 'prabhat' ? 'Prabhat (Studio Indian Male)' : 'Neerja (Studio Indian Female)';
          showToast(`🎙️ Speaking with ${voiceLabel}`, "info");
        } catch (err) {
          console.warn("Backend TTS stream fallback to browser speech synthesis:", err);
          // Fallback to browser SpeechSynthesis if network or server error
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-IN';
            utterance.rate = 0.93;
            utterance.pitch = 1.0;

            const availableVoices = voices.length > 0 ? voices : window.speechSynthesis.getVoices();
            const indVoice = availableVoices.find(v => 
              (v.lang === 'en-IN' || v.lang === 'en_IN' || v.lang.toLowerCase().includes('en-in')) ||
              v.name.toLowerCase().includes('india')
            );
            if (indVoice) utterance.voice = indVoice;

            utterance.onstart = () => { setIsSpeaking(true); setAudioLoading(false); };
            utterance.onend = () => { setIsSpeaking(false); setAudioLoading(false); };
            utterance.onerror = () => { setIsSpeaking(false); setAudioLoading(false); };

            window.speechSynthesis.speak(utterance);
            showToast("Playing summary audio...", "info");

            setAudioLoading(false);
            setIsSpeaking(false);
            showToast("Text-to-speech audio could not be generated.", "error");
          }

                              className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 font-semibold rounded-lg transition flex items-center gap-1"
                            >
                              <span>[Download]</span>
                            </button>

                            <button
                              onClick={(e) => handleDeleteSummary(item._id, e)}
                              className="px-3 py-1.5 text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg transition font-semibold flex items-center gap-1"
                            >
                              <span>[Delete]</span>
                            </button>
                          </div>
                        </div>

                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: ROUGE ACCURACY & METRICS */}
            {activeTab === 'benchmarks' && (
              <div className="space-y-5">
                
                {/* Clean Header */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200/80 card-shadow flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 font-heading flex items-center gap-2">
                      <span>📊</span> Summary Accuracy Evaluator
                    </h2>
                    <p className="text-xs sm:text-sm text-slate-500 mt-1">
                      Measure how well a summary captures the key points and flow of the original text.
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 text-xs font-semibold">
                    <span className="px-3 py-1 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-100/80 flex items-center gap-1.5">
                      <span>🎯</span> Word Accuracy
                    </span>
                    <span className="px-3 py-1 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-100/80 flex items-center gap-1.5">
                      <span>🔗</span> Phrasing Flow
                    </span>
                  </div>
                </div>

                {/* Primary Interactive Summary Tester */}
                <div className="bg-white border border-slate-200/80 rounded-2xl p-5 sm:p-6 space-y-4 card-shadow">
                  
                  {/* Tester Header */}
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                    <div>
                      <span className="text-sm font-bold text-slate-900 block font-heading">
                        Test Any Summary
                      </span>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Paste original text and summary to calculate accuracy scores instantly
                      </p>
                    </div>

                    <div className="flex items-center gap-2">
                      {(rougeRef || rougeCand || rougeScores) && (
                        <button
                          onClick={handleClearRouge}
                          className="px-3 py-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 text-xs font-semibold rounded-xl transition"
                        >
                          ✕ Clear
                        </button>
                      )}
                    </div>
                  </div>
                  
                  {/* 2-Column Side-by-Side Editors */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    
                    {/* Original Reference Box */}
                    <div className="space-y-1.5">
                      <div className="flex items-center justify-between">
                        <label className="text-slate-700 font-bold flex items-center gap-1.5 text-xs">
                          <span>📖</span> Original Text (Reference)
                        </label>
                        <span className="text-[11px] text-slate-400 font-medium">
                          {rougeRef.trim() ? rougeRef.trim().split(/\s+/).length : 0} words
                        </span>
                      </div>
                      <textarea
                        value={rougeRef}
                        onChange={(e) => setRougeRef(e.target.value)}
                        placeholder="Paste the original article or reference text here..."
                        className="w-full h-36 p-3.5 rounded-xl bg-slate-50 hover:bg-slate-100/50 focus:bg-white border border-slate-200 text-slate-900 text-xs sm:text-sm leading-relaxed focus:outline-none focus:border-indigo-500 resize-none transition shadow-2xs"
                      />
                    </div>

                    {/* Candidate Summary Box */}
                    <div className="space-y-1.5">
                      <div className="flex items-center justify-between">
                        <label className="text-slate-700 font-bold flex items-center gap-1.5 text-xs">
                          <span>📝</span> Summary to Test
                        </label>
                        <span className="text-[11px] text-slate-400 font-medium">
                          {rougeCand.trim() ? rougeCand.trim().split(/\s+/).length : 0} words
                        </span>
                      </div>
                      <textarea
                        value={rougeCand}
                        onChange={(e) => setRougeCand(e.target.value)}
                        placeholder="Paste the summary you want to evaluate here..."
                        className="w-full h-36 p-3.5 rounded-xl bg-slate-50 hover:bg-slate-100/50 focus:bg-white border border-slate-200 text-slate-900 text-xs sm:text-sm leading-relaxed focus:outline-none focus:border-indigo-500 resize-none transition shadow-2xs"
                      />
                    </div>

                  </div>

                  {/* Calculate Action CTA */}
                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-2">
                    <button
                      onClick={handleComputeRouge}
                      disabled={rougeLoading || !rougeRef.trim() || !rougeCand.trim()}
                      className={`group w-full sm:w-auto px-7 py-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 whitespace-nowrap ${
                        rougeLoading || !rougeRef.trim() || !rougeCand.trim()
                          ? 'bg-slate-100 text-slate-400 border border-slate-200/80 cursor-not-allowed shadow-none'
                          : 'btn-3d-primary text-white cursor-pointer select-none'
                      }`}
                    >
                      {rougeLoading ? (
                        <>
                          <svg className="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                          </svg>
                          <span>Analyzing Accuracy...</span>
                        </>
                      ) : (
                        <>
                          <SparklesIcon className={`w-4 h-4 transition-transform duration-200 ${
                            !rougeRef.trim() || !rougeCand.trim()
                              ? 'text-slate-400 opacity-60'
                              : 'text-amber-300 drop-shadow-xs group-hover:scale-125 group-hover:rotate-12'
                          }`} />
                          <span className="font-extrabold">Calculate ROUGE Accuracy</span>
                        </>
                      )}
                    </button>
                    
                    <span className="text-xs text-slate-400 text-center sm:text-right">
                      Evaluates word retention, phrasing match, and structural accuracy
                    </span>
                  </div>

                  {/* Easy-to-Read Results */}
                  {rougeScores && (
                    <div className="pt-4 border-t border-slate-100 space-y-4 animate-fadeIn">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-slate-800 uppercase tracking-wider font-heading">
                          Accuracy Results
                        </span>
                        <span className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full flex items-center gap-1.5">
                          <span>✓</span> Evaluation Complete
                        </span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5 text-center text-xs">
                        
                        {/* Metric 1: Word Match */}
                        <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-2">
                          <span className="text-slate-500 text-xs font-bold flex items-center justify-center gap-1.5">
                            <span>🎯</span> Word Match (ROUGE-1)
                          </span>
                          <span className="text-2xl sm:text-3xl font-extrabold text-indigo-600 block">
                            {(rougeScores.rouge1.f1 * 100).toFixed(1)}%
                          </span>
                          <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div className="bg-indigo-600 h-2 rounded-full transition-all duration-500" style={{ width: `${Math.min(100, rougeScores.rouge1.f1 * 100)}%` }}></div>
                          </div>
                          <p className="text-[11px] text-slate-500 pt-1">
                            Checks if essential keywords and facts from original text are retained.
                          </p>
                        </div>

                        {/* Metric 2: Phrase Match */}
                        <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-2">
                          <span className="text-slate-500 text-xs font-bold flex items-center justify-center gap-1.5">
                            <span>🔗</span> Phrase Flow (ROUGE-2)
                          </span>
                          <span className="text-2xl sm:text-3xl font-extrabold text-indigo-600 block">
                            {(rougeScores.rouge2.f1 * 100).toFixed(1)}%
                          </span>
                          <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div className="bg-indigo-500 h-2 rounded-full transition-all duration-500" style={{ width: `${Math.min(100, rougeScores.rouge2.f1 * 100)}%` }}></div>
                          </div>
                          <p className="text-[11px] text-slate-500 pt-1">
                            Checks two-word combinations for natural phrasing and fluency.
                          </p>
                        </div>

                        {/* Metric 3: Sentence Flow */}
                        <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-2">
                          <span className="text-slate-500 text-xs font-bold flex items-center justify-center gap-1.5">
                            <span>📐</span> Structure Match (ROUGE-L)
                          </span>
                          <span className="text-2xl sm:text-3xl font-extrabold text-emerald-600 block">
                            {(rougeScores.rougeL.f1 * 100).toFixed(1)}%
                          </span>
                          <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div className="bg-emerald-500 h-2 rounded-full transition-all duration-500" style={{ width: `${Math.min(100, rougeScores.rougeL.f1 * 100)}%` }}></div>
                          </div>
                          <p className="text-[11px] text-slate-500 pt-1">
                            Checks if the overall sentence structure and story flow are preserved.
                          </p>
                        </div>

                      </div>
                    </div>
                  )}

                </div>

                {/* Simplified Benchmark Overview */}
                <div className="bg-white border border-slate-200/80 rounded-2xl p-5 sm:p-6 card-shadow space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-slate-900 font-heading">
                        ⚡ AI Model Performance Comparison
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Benchmark scores across standard test datasets
                      </p>
                    </div>
                    <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">
                      Industry Standard
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5 text-xs">
                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200/80 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-slate-900">BART Transformer</span>
                        <span className="text-indigo-600 font-bold bg-indigo-50 border border-indigo-100 px-2 py-0.5 rounded-md text-[11px]">44.2%</span>
                      </div>
                      <p className="text-slate-500 text-[11px] leading-relaxed">
                        Best for conversational dialogue, meetings, and deep rewriting.
                      </p>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200/80 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-slate-900">Pegasus Model</span>
                        <span className="text-purple-600 font-bold bg-purple-50 border border-purple-100 px-2 py-0.5 rounded-md text-[11px]">43.5%</span>
                      </div>
                      <p className="text-slate-500 text-[11px] leading-relaxed">
                        Best for long news articles, press releases, and publications.
                      </p>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200/80 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-slate-900">LexiBrief Saliency</span>
                        <span className="text-emerald-600 font-bold bg-emerald-50 border border-emerald-100 px-2 py-0.5 rounded-md text-[11px]">41.0%</span>
                      </div>
                      <p className="text-slate-500 text-[11px] leading-relaxed">
                        Instant 0ms speed for quick key-sentence extraction.
                      </p>
                    </div>
                  </div>
                </div>

                {/* Simple 3-Step Guide */}
                <div className="bg-white border border-slate-200/80 rounded-2xl p-5 sm:p-6 card-shadow space-y-3">
                  <span className="text-xs font-bold text-slate-700 uppercase tracking-wider block font-heading">
                    💡 Quick Guide
                  </span>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                    <div className="p-3.5 bg-slate-50 rounded-xl border border-slate-200/70">
                      <span className="font-bold text-slate-900 flex items-center gap-1.5 mb-1">
                        <span>🎯</span> 1. Word Match
                      </span>
                      <p className="text-slate-500 text-[11px] leading-relaxed">
                        A score above <b>40%</b> indicates strong keyword and factual coverage from the original document.
                      </p>
                    </div>

                    <div className="p-3.5 bg-slate-50 rounded-xl border border-slate-200/70">
                      <span className="font-bold text-slate-900 flex items-center gap-1.5 mb-1">
                        <span>🔗</span> 2. Phrase Flow
                      </span>
                      <p className="text-slate-500 text-[11px] leading-relaxed">
                        A score above <b>20%</b> reflects smooth phrasing, natural grammar, and coherent sentence connectors.
                      </p>
                    </div>

                    <div className="p-3.5 bg-slate-50 rounded-xl border border-slate-200/70">
                      <span className="font-bold text-slate-900 flex items-center gap-1.5 mb-1">
                        <span>📐</span> 3. Structure
                      </span>
                      <p className="text-slate-500 text-[11px] leading-relaxed">
                        Measures the overall progression of ideas from the start to the end of the text.
                      </p>
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>



          {/* Document Full-Text Preview Modal */}
          {previewDoc && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
                
                {/* Modal Header */}
                <div className="p-5 border-b border-slate-100 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <span className={`px-2.5 py-0.5 border text-xs font-bold rounded-lg ${
                      (previewDoc.format || 'TXT').toUpperCase() === 'PDF' ? 'bg-rose-50 text-rose-700 border-rose-200' :
                      (previewDoc.format || 'TXT').toUpperCase() === 'DOCX' ? 'bg-sky-50 text-sky-700 border-sky-200' :
                      'bg-indigo-50 text-indigo-700 border-indigo-200'
                    }`}>
                      {(previewDoc.format || 'TXT').toUpperCase()}
                    </span>
                    <div>
                      <h3 className="text-sm font-bold text-slate-900 font-heading">
                        {previewDoc.filename}
                      </h3>
                      <span className="text-[11px] text-slate-400">
                        Uploaded: {previewDoc.uploaded_at}
                      </span>
                    </div>
                  </div>

                  <button
                    onClick={() => setPreviewDoc(null)}
                    className="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center text-sm font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Metadata Stats Bar */}
                <div className="px-5 py-2.5 bg-slate-50/80 border-b border-slate-100 flex flex-wrap items-center gap-4 text-xs text-slate-600 font-medium">
                  <span><b>{previewDoc.words || 0}</b> words</span>
                  <span>•</span>
                  <span><b>{previewDoc.sentences || 0}</b> sentences</span>
                  <span>•</span>
                  <span><b>{previewDoc.characters || 0}</b> characters</span>
                  <span>•</span>
                  <span>Est. Read: <b>~{Math.max(1, Math.ceil((previewDoc.words || 0) / 200))} min</b></span>
                </div>

                {/* Modal Body - Full Extracted Text */}
                <div className="p-5 overflow-y-auto flex-1 space-y-3">
                  <div className="flex items-center justify-between text-xs text-slate-400 font-semibold uppercase tracking-wider">
                    <span>Extracted Document Text</span>
                    <button
                      onClick={() => copyToClipboard(previewDoc.text_content || previewDoc.text_snippet || '')}
                      className="text-indigo-600 hover:text-indigo-700 font-bold normal-case text-xs flex items-center gap-1"
                    >
                      <span>📋 Copy Full Text</span>
                    </button>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 text-sm leading-relaxed font-sans whitespace-pre-wrap select-text max-h-[45vh] overflow-y-auto">
                    {previewDoc.text_content || previewDoc.text_snippet || "No text content available."}
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="p-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl flex flex-wrap items-center justify-between gap-3">
                  <button
                    onClick={(e) => exportDocTxt(previewDoc, e)}
                    className="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold transition flex items-center gap-1.5"
                  >
                    <span>📥 Download .TXT</span>
                  </button>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setPreviewDoc(null)}
                      className="px-4 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold transition"
                    >
                      Close
                    </button>
                    <button
                      onClick={() => {
                        setInputText(previewDoc.text_content || previewDoc.text_snippet || '');
                        setPreviewDoc(null);
                        setActiveTab('summarize');
                        showToast(`Loaded ${previewDoc.filename} into active editor!`, "info");
                      }}
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition shadow-xs flex items-center gap-1.5"
                    >
                      <span>⚡ Summarize This Document</span>
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* Mobile Bottom Navigation Bar for quick single-tap switching on small screens */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 flex items-center justify-around py-1.5 px-2 shadow-lg">
            {[
              { id: 'summarize', label: 'Summarize', icon: <SparklesIcon className="w-5 h-5 text-amber-500" /> },
              { id: 'documents', label: 'Docs', icon: <DocumentIcon className="w-5 h-5 text-indigo-600" />, count: documentsList.length },
              { id: 'history', label: 'History', icon: <HistoryIcon className="w-5 h-5 text-indigo-600" />, count: summariesList.length },
              { id: 'benchmarks', label: 'ROUGE', icon: <ChartIcon className="w-5 h-5 text-indigo-600" /> }
            ].map(tab => {
              const isActive = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => {
                    setActiveTab(tab.id);
                    setMobileMenuOpen(false);
                  }}
                  className={`relative flex flex-col items-center justify-center flex-1 py-1 px-1 rounded-xl transition-all ${
                    isActive ? 'text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  <span className={`transition-transform duration-150 flex items-center justify-center ${isActive ? 'scale-110' : 'opacity-70'}`}>
                    {tab.icon}
                  </span>
                  <span className="text-[10px] mt-1 font-medium leading-tight">{tab.label}</span>
                  {tab.count !== undefined && tab.count > 0 && (
                    <span className="absolute top-0.5 right-1/4 -translate-y-0.5 translate-x-2 bg-indigo-600 text-white text-[9px] font-bold px-1 rounded-full min-w-[14px] text-center shadow-2xs">
                      {tab.count}
                    </span>
                  )}
                  {isActive && (
                    <span className="w-1.5 h-1.5 rounded-full bg-indigo-600 mt-0.5 shadow-2xs"></span>
                  )}
                </button>
              );
            })}
          </nav>

          {/* Toast Notification */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}

          {/* Enhanced Clean Footer */}
          <footer className="border-t border-slate-200/80 bg-white py-6 mt-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
              <div className="flex items-center gap-2.5 font-medium">
                <div className="relative w-6 h-6 rounded-lg overflow-hidden shadow-2xs border border-indigo-100/80 bg-white flex items-center justify-center flex-shrink-0">
                  <img 
                    src="/static/logo.jpg" 
                    alt="LexiBrief" 
                    className="w-full h-full object-cover"
                    onError={(e) => {
                      e.target.style.display = 'none';
                      e.target.parentElement.classList.add('bg-indigo-600', 'text-white', 'font-bold', 'text-[10px]');
                      e.target.parentElement.innerText = 'L';
                    }}
                  />
                </div>
                <span className="font-bold text-slate-800 font-heading">LexiBrief</span>
                <span className="text-slate-300">•</span>
                <span>Text Summarizer & NLP Platform</span>
              </div>
              <div className="text-slate-400 text-[11px]">
                Extractive & Deep Abstractive Neural Synthesis
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

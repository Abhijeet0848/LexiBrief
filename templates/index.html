<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiBrief - State-of-the-Art NLP Text Summarization Platform</title>
  <meta name="description" content="AI-powered Text Summarization with Extractive TF-IDF, Abstractive Transformers (BART/T5/Pegasus), MongoDB Persistence, and ROUGE Evaluation." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN for instant styling primitives -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f7ff',
              100: '#ebf0fe',
              200: '#ced9fd',
              300: '#a3bbfb',
              400: '#7195f7',
              500: '#436cf0',
              600: '#264de4',
              700: '#1d3bb8',
              800: '#1c3395',
              900: '#1c2d76',
              950: '#111b49',
            },
            accent: {
              purple: '#8b5cf6',
              cyan: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
    }
    
    /* Glassmorphic card styling */
    .glass-panel {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    /* Gradient glow effects */
    .glow-purple {
      box-shadow: 0 0 25px -5px rgba(139, 92, 246, 0.3);
    }
    .glow-blue {
      box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.3);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.6);
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Toast Notification Component
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const timer = setTimeout(onClose, 4000);
        return () => clearTimeout(timer);
      }, [onClose]);

      const bg = type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-200' :
                 type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
                 'bg-brand-950/90 border-brand-500 text-brand-200';

      return (
        <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl border backdrop-blur-md shadow-2xl ${bg} animate-bounce-short`}>
          <span className="text-sm font-medium">{message}</span>
          <button onClick={onClose} className="p-1 hover:opacity-75 transition">✕</button>
        </div>
      );
    }

    // Modal Component
    function Modal({ isOpen, onClose, title, children }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="bg-slate-900 border border-slate-700/60 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950/50">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">{title}</h3>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">✕</button>
            </div>
            <div className="p-6 overflow-y-auto space-y-4">
              {children}
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      // Navigation state
      const [activeTab, setActiveTab] = useState('summarize'); // summarize, documents, history, benchmarks, settings
      
      // Editor & Output state
      const [inputText, setInputText] = useState('');
      const [summaryResult, setSummaryResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Model & Config parameters
      const [engineMethod, setEngineMethod] = useState('auto'); // auto, abstractive, extractive
      const [modelChoice, setModelChoice] = useState('bart'); // bart, t5, pegasus
      const [summaryMode, setSummaryMode] = useState('balanced'); // concise, balanced, detailed
      const [minLength, setMinLength] = useState(30);
      const [maxLength, setMaxLength] = useState(130);

      // Database & History State
      const [dbStatus, setDbStatus] = useState(null);
      const [summariesList, setSummariesList] = useState([]);
      const [documentsList, setDocumentsList] = useState([]);
      const [historySearch, setHistorySearch] = useState('');
      const [selectedHistoryItem, setSelectedHistoryItem] = useState(null);
      const [selectedDocItem, setSelectedDocItem] = useState(null);

      // Presets
      const [presets, setPresets] = useState([]);

      // Optional Authentication State
      const [currentUser, setCurrentUser] = useState('gautamabhijeet050_db_user');
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authUsernameInput, setAuthUsernameInput] = useState('gautamabhijeet050_db_user');

      // Standalone ROUGE Calculator State
      const [rougeRef, setRougeRef] = useState('');
      const [rougeCand, setRougeCand] = useState('');
      const [rougeLiveScore, setRougeLiveScore] = useState(null);

      // Speech synthesis
      const [isSpeaking, setIsSpeaking] = useState(false);
      const speechRef = useRef(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
      };

      // Initial data fetch
      useEffect(() => {
        fetchDbStatus();
        fetchPresets();
        fetchSummaries();
        fetchDocuments();
      }, []);

      const fetchDbStatus = async () => {
        try {
          const res = await fetch('/api/db/status');
          if (res.ok) {
            const data = await res.json();
            setDbStatus(data);
          }
        } catch (e) {
          console.error("DB status fetch error", e);
        }
      };

      const fetchPresets = async () => {
        try {
          const res = await fetch('/api/presets');
          if (res.ok) {
            const data = await res.json();
            setPresets(data.presets || []);
          }
        } catch (e) {
          console.error("Presets fetch error", e);
        }
      };

      const fetchSummaries = async () => {
        try {
          const res = await fetch('/api/summaries?limit=50');
          if (res.ok) {
            const data = await res.json();
            setSummariesList(data.summaries || []);
          }
        } catch (e) {
          console.error("Summaries fetch error", e);
        }
      };

      const fetchDocuments = async () => {
        try {
          const res = await fetch('/api/documents?limit=50');
          if (res.ok) {
            const data = await res.json();
            setDocumentsList(data.documents || []);
          }
        } catch (e) {
          console.error("Documents fetch error", e);
        }
      };

      // Handle Text Summarization
      const handleSummarize = async () => {
        if (!inputText.trim()) {
          showToast("Please enter or paste text to summarize.", "error");
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: inputText,
              mode: summaryMode,
              method: engineMethod,
              model_name: modelChoice,
              max_length: maxLength,
              min_length: minLength
            })
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || "Summarization request failed.");
          }

          const data = await res.json();
          setSummaryResult(data);
          showToast("Summary generated & saved to MongoDB!", "success");
          fetchDbStatus();
          fetchSummaries();
        } catch (err) {
          showToast(`Error: ${err.message}`, "error");
        } finally {
          setIsLoading(false);
        }
      };

      // Handle File Upload (PDF, DOCX, TXT)
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        setUploadLoading(true);
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Failed to extract file.");
          }

          const data = await res.json();
          setInputText(data.text || '');
          showToast(`Extracted ${data.filename} (${data.format}) & saved to MongoDB Documents!`, "success");
          fetchDocuments();
          fetchDbStatus();
        } catch (err) {
          showToast(`Extraction failed: ${err.message}`, "error");
        } finally {
          setUploadLoading(false);
          e.target.value = '';
        }
      };

      // Delete Summary
      const handleDeleteSummary = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Are you sure you want to delete this summary from MongoDB?")) return;
        try {
          const res = await fetch(`/api/summaries/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Summary removed from database.", "info");
            fetchSummaries();
            fetchDbStatus();
            if (selectedHistoryItem?._id === id) setSelectedHistoryItem(null);
          }
        } catch (err) {
          showToast("Failed to delete summary.", "error");
        }
      };

      // Delete Document
      const handleDeleteDocument = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Delete this document from MongoDB?")) return;
        try {
          const res = await fetch(`/api/documents/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Document deleted.", "info");
            fetchDocuments();
            fetchDbStatus();
            if (selectedDocItem?._id === id) setSelectedDocItem(null);
          }
        } catch (err) {
          showToast("Failed to delete document.", "error");
        }
      };

      // Standalone ROUGE evaluate
      const handleCalculateCustomRouge = async () => {
        if (!rougeRef.trim() || !rougeCand.trim()) {
          showToast("Please provide both reference text and summary candidate.", "error");
          return;
        }
        try {
          const res = await fetch('/api/rouge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reference: rougeRef, summary: rougeCand })
          });
          if (res.ok) {
            const data = await res.json();
            setRougeLiveScore(data.rouge);
            showToast("ROUGE scores computed!", "success");
          }
        } catch (err) {
          showToast("ROUGE calculation failed.", "error");
        }
      };

      // Text to Speech
      const handleSpeak = (text) => {
        if (!('speechSynthesis' in window)) {
          showToast("Text-to-speech not supported on this browser.", "error");
          return;
        }
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        window.speechSynthesis.speak(utterance);
        setIsSpeaking(true);
      };

      // Export handlers
      const exportAsTxt = (summary, title = 'LexiBrief_Summary') => {
        const blob = new Blob([summary], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${title}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Downloaded as TXT file.", "success");
      };

      const exportAsJson = (data, title = 'LexiBrief_Record') => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${title}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Exported as JSON.", "success");
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        showToast("Copied to clipboard!", "success");
      };

      // Computed stats for input
      const inputStats = useMemo(() => {
        const words = inputText.trim() ? inputText.trim().split(/\s+/).length : 0;
        const chars = inputText.length;
        const sentences = inputText.trim() ? (inputText.match(/[^.!?]+[.!?]+/g) || [inputText]).length : 0;
        const readTime = Math.ceil(words / 200 * 60);
        return { words, chars, sentences, readTime };
      }, [inputText]);

      // Filtered summaries
      const filteredSummaries = useMemo(() => {
        if (!historySearch.trim()) return summariesList;
        const q = historySearch.toLowerCase();
        return summariesList.filter(s => 
          (s.summary && s.summary.toLowerCase().includes(q)) ||
          (s.text_snippet && s.text_snippet.toLowerCase().includes(q)) ||
          (s.method && s.method.toLowerCase().includes(q))
        );
      }, [summariesList, historySearch]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navigation Bar */}
          <header className="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo & Name */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-accent-cyan flex items-center justify-center shadow-lg shadow-brand-500/20 ring-1 ring-white/20">
                  <span className="text-xl font-black text-white tracking-wider">L</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-brand-300 bg-clip-text text-transparent">
                      LexiBrief
                    </span>
                    <span className="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-full bg-brand-500/20 text-brand-300 border border-brand-500/30">
                      NLP Core
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 font-medium">State-of-the-Art Text Summarization Platform</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-800">
                {[
                  { id: 'summarize', label: 'Summarize', icon: '✨' },
                  { id: 'documents', label: 'Documents', icon: '📄', count: documentsList.length },
                  { id: 'history', label: 'History', icon: '🕘', count: summariesList.length },
                  { id: 'benchmarks', label: 'ROUGE Benchmarks', icon: '📈' },
                  { id: 'settings', label: 'DB & Engine', icon: '⚙️' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                      activeTab === tab.id 
                        ? 'bg-gradient-to-r from-brand-600 to-indigo-600 text-white shadow-md shadow-brand-600/30' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                    {tab.count !== undefined && (
                      <span className="ml-1 px-1.5 py-0.2 text-[10px] bg-slate-800 rounded-full text-slate-300">
                        {tab.count}
                      </span>
                    )}
                  </button>
                ))}
              </nav>

              {/* Right Profile & MongoDB Status */}
              <div className="flex items-center gap-3">
                {/* DB status pill */}
                <div className="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-xs">
                  <span className={`w-2 h-2 rounded-full ${dbStatus?.status === 'connected' || dbStatus?.status === 'active' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                  <span className="text-slate-300 font-mono text-[11px]">{dbStatus?.database || 'lexibrief_db'}</span>
                </div>

                {/* User Auth Profile Button */}
                <button
                  onClick={() => setIsAuthModalOpen(true)}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-slate-200 transition shadow"
                  title="Database User Profile"
                >
                  <div className="w-5 h-5 rounded-full bg-brand-600 flex items-center justify-center text-[10px] text-white font-bold">
                    {currentUser[0]?.toUpperCase() || 'U'}
                  </div>
                  <span className="hidden sm:inline max-w-[120px] truncate">{currentUser}</span>
                </button>
              </div>

            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            {/* TAB 1: SUMMARIZE */}
            {activeTab === 'summarize' && (
              <div className="space-y-6 animate-fade-in">
                
                {/* Engine Selector Cards */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {/* Extractive Card */}
                  <div 
                    onClick={() => setEngineMethod('extractive')}
                    className={`cursor-pointer p-4 rounded-2xl border transition-all ${
                      engineMethod === 'extractive' 
                        ? 'bg-gradient-to-b from-brand-950/60 to-slate-900 border-brand-500/80 ring-2 ring-brand-500/30' 
                        : 'glass-panel hover:border-slate-700'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">🔎</span>
                        <h4 className="font-bold text-sm text-white">Extractive Engine</h4>
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 font-mono">TF-IDF Saliency</span>
                    </div>
                    <p className="text-xs text-slate-400">Identifies and extracts high-impact thesis sentences mathematically with zero hallucination risk.</p>
                  </div>

                  {/* Abstractive Card */}
                  <div 
                    onClick={() => setEngineMethod('abstractive')}
                    className={`cursor-pointer p-4 rounded-2xl border transition-all ${
                      engineMethod === 'abstractive' 
                        ? 'bg-gradient-to-b from-indigo-950/60 to-slate-900 border-indigo-500/80 ring-2 ring-indigo-500/30' 
                        : 'glass-panel hover:border-slate-700'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">✨</span>
                        <h4 className="font-bold text-sm text-white">Abstractive Transformers</h4>
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono">Seq2Seq Neural</span>
                    </div>
                    <p className="text-xs text-slate-400">Generates fluent human-like paraphrased synthesis utilizing deep encoder-decoder transformers.</p>
                  </div>

                  {/* Auto Hybrid Card */}
                  <div 
                    onClick={() => setEngineMethod('auto')}
                    className={`cursor-pointer p-4 rounded-2xl border transition-all ${
                      engineMethod === 'auto' 
                        ? 'bg-gradient-to-b from-accent-cyan/10 to-slate-900 border-cyan-500/80 ring-2 ring-cyan-500/30' 
                        : 'glass-panel hover:border-slate-700'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">⚡</span>
                        <h4 className="font-bold text-sm text-white">Auto-Adaptive Hybrid</h4>
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-mono">Dynamic AI</span>
                    </div>
                    <p className="text-xs text-slate-400">Automatically evaluates token count and routes to optimal neural or saliency pipelines seamlessly.</p>
                  </div>
                </div>

                {/* Configuration Controls Bar */}
                <div className="glass-panel p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                  
                  {/* Left: Model Choice & Mode */}
                  <div className="flex flex-wrap items-center gap-4">
                    {/* Transformer Architecture Selector */}
                    {(engineMethod === 'abstractive' || engineMethod === 'auto') && (
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-semibold text-slate-300">Transformer:</span>
                        <select 
                          value={modelChoice} 
                          onChange={(e) => setModelChoice(e.target.value)}
                          className="glass-input text-xs font-medium text-slate-200 py-1.5 px-3 rounded-xl focus:outline-none cursor-pointer"
                        >
                          <option value="bart" className="bg-slate-900">BART (DistilBART-CNN-12-6)</option>
                          <option value="bart-large" className="bg-slate-900">BART Large (Facebook CNN)</option>
                          <option value="t5" className="bg-slate-900">Google T5 (T5-Small Seq2Seq)</option>
                          <option value="pegasus" className="bg-slate-900">Google Pegasus (CNN/DailyMail)</option>
                        </select>
                      </div>
                    )}

                    {/* Summary Mode Pill */}
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-semibold text-slate-300">Length Mode:</span>
                      <div className="inline-flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                        {['concise', 'balanced', 'detailed'].map(mode => (
                          <button
                            key={mode}
                            onClick={() => {
                              setSummaryMode(mode);
                              if (mode === 'concise') { setMinLength(20); setMaxLength(64); }
                              else if (mode === 'balanced') { setMinLength(40); setMaxLength(128); }

                {/* Standalone Live ROUGE Evaluator Tool */}
                <div className="glass-panel p-5 rounded-2xl space-y-4">
                  <h4 className="font-bold text-sm text-white flex items-center gap-2">
                    <span>🧪</span> Custom Pair ROUGE Evaluator
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-300 mb-1 block">Reference Text (Ground Truth / Source)</label>
                      <textarea
                        value={rougeRef}
                        onChange={(e) => setRougeRef(e.target.value)}
                        placeholder="Paste reference text here..."
                        className="w-full h-32 p-3 rounded-xl glass-input text-xs text-white focus:outline-none resize-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-300 mb-1 block">Candidate Summary</label>
                      <textarea
                        value={rougeCand}
                        onChange={(e) => setRougeCand(e.target.value)}
                        placeholder="Paste generated or evaluated candidate summary here..."
                        className="w-full h-32 p-3 rounded-xl glass-input text-xs text-white focus:outline-none resize-none"
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-between">
                    <button
                      onClick={handleCalculateCustomRouge}
                      className="px-5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 font-bold text-xs text-white shadow-lg transition"
                    >
                      ⚡ Compute ROUGE Metrics
                    </button>
                  </div>

                  {rougeLiveScore && (
                    <div className="p-4 rounded-xl bg-slate-950/80 border border-slate-800 grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="p-3 rounded-lg bg-slate-900/60 text-center">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">ROUGE-1 (Unigram)</span>
                        <div className="text-xl font-extrabold text-brand-400 my-1">
                          {(rougeLiveScore.rouge1.f1 * 100).toFixed(1)}% F1
                        </div>
                        <div className="text-[10px] text-slate-400">
                          P: {(rougeLiveScore.rouge1.precision * 100).toFixed(1)}% | R: {(rougeLiveScore.rouge1.recall * 100).toFixed(1)}%
                        </div>
                      </div>

                      <div className="p-3 rounded-lg bg-slate-900/60 text-center">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">ROUGE-2 (Bigram)</span>
                        <div className="text-xl font-extrabold text-indigo-400 my-1">
                          {(rougeLiveScore.rouge2.f1 * 100).toFixed(1)}% F1
                        </div>
                        <div className="text-[10px] text-slate-400">
                          P: {(rougeLiveScore.rouge2.precision * 100).toFixed(1)}% | R: {(rougeLiveScore.rouge2.recall * 100).toFixed(1)}%
                        </div>
                      </div>

                      <div className="p-3 rounded-lg bg-slate-900/60 text-center">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">ROUGE-L (LCS)</span>
                        <div className="text-xl font-extrabold text-emerald-400 my-1">
                          {(rougeLiveScore.rougeL.f1 * 100).toFixed(1)}% F1
                        </div>
                        <div className="text-[10px] text-slate-400">
                          P: {(rougeLiveScore.rougeL.precision * 100).toFixed(1)}% | R: {(rougeLiveScore.rougeL.recall * 100).toFixed(1)}%
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 5: DB & SETTINGS */}
            {activeTab === 'settings' && (
              <div className="space-y-6 animate-fade-in max-w-4xl mx-auto">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> Database & NLP Pipeline Settings
                  </h2>
                  <p className="text-xs text-slate-400">MongoDB Connection, Collection Telemetry & Model Orchestration</p>
                </div>

                {/* MongoDB Status Box */}
                <div className="glass-panel p-5 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between">
                    <h4 className="font-bold text-sm text-white">MongoDB Persistence Layer</h4>
                    <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono text-xs font-bold">
                      {dbStatus?.engine || 'MongoDB Active'}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                      <span className="text-slate-400 block mb-1">Authenticated DB User:</span>
                      <span className="text-white font-mono font-bold text-sm">{currentUser}</span>
                    </div>

                    <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                      <span className="text-slate-400 block mb-1">Target Database:</span>
                      <span className="text-cyan-300 font-mono font-bold text-sm">{dbStatus?.database || 'lexibrief_db'}</span>
                    </div>

                    <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                      <span className="text-slate-400 block mb-1">Summaries Collection Count:</span>
                      <span className="text-emerald-400 font-mono font-bold text-sm">{dbStatus?.collections?.summaries || 0} records</span>
                    </div>

                    <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                      <span className="text-slate-400 block mb-1">Documents Collection Count:</span>
                      <span className="text-brand-400 font-mono font-bold text-sm">{dbStatus?.collections?.documents || 0} records</span>
                    </div>
                  </div>
                </div>

                {/* Optional Environment Variables Guide */}
                <div className="glass-panel p-5 rounded-2xl space-y-3">
                  <h4 className="font-bold text-sm text-white">MongoDB Atlas Connection Setup (.env)</h4>
                  <p className="text-xs text-slate-400">
                    To connect directly to MongoDB Atlas Cloud, configure the <code className="text-cyan-300 font-mono">.env</code> file with:
                  </p>
                  <pre className="p-3 rounded-xl bg-slate-950 font-mono text-xs text-slate-300 overflow-x-auto border border-slate-800">
MONGODB_USER=gautamabhijeet050_db_user
MONGODB_PASSWORD=your_mongodb_password
MONGODB_CLUSTER=cluster0.xxxx
MONGODB_DB=lexibrief_db
                  </pre>
                </div>
              </div>
            )}

          </main>

          {/* User Auth / Profile Modal */}
          <Modal
            isOpen={isAuthModalOpen}
            onClose={() => setIsAuthModalOpen(false)}
            title="👤 User & Database Credentials"
          >
            <div className="space-y-4 text-xs">
              <p className="text-slate-300">
                Configure your active MongoDB session identifier or switch accounts:
              </p>
              <div>
                <label className="text-slate-400 font-semibold mb-1 block">Username / Account Name:</label>
                <input
                  type="text"
                  value={authUsernameInput}
                  onChange={(e) => setAuthUsernameInput(e.target.value)}
                  className="w-full p-2.5 rounded-xl glass-input text-white focus:outline-none font-mono"
                />
              </div>
              <div className="flex items-center justify-end gap-2 pt-2">
                <button
                  onClick={() => {
                    setCurrentUser(authUsernameInput.trim() || 'gautamabhijeet050_db_user');
                    setIsAuthModalOpen(false);
                    showToast(`Active account set to ${authUsernameInput}!`, "success");
                  }}
                  className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 font-bold text-white transition"
                >
                  Save Profile
                </button>
              </div>
            </div>
          </Modal>

          {/* Toast Notification */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800/60 bg-slate-950/60 py-4 text-center text-xs text-slate-500">
            <span>LexiBrief NLP Platform • Powered by Python, Transformers, FastAPI, MongoDB & React</span>
          </footer>
        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

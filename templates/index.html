<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiBrief - AI Text Summarizer</title>
  <meta name="description" content="AI Text Summarizer powered by Extractive TF-IDF & Deep Transformers with live MongoDB Cloud persistence." />

  <!-- Premium Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            heading: ['"Outfit"', '"Plus Jakarta Sans"', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }
    .card-shadow {
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
    }
    .card-shadow-md {
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    }
    textarea {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      letter-spacing: -0.01em;
    }
    ::placeholder {
      color: #94a3b8 !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-600 selection:text-white">
  <div id="root"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Toast Notification
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 3500);
        return () => clearTimeout(t);
      }, [onClose]);

      const bg = type === 'error' ? 'bg-rose-600 text-white' :
                 type === 'success' ? 'bg-emerald-600 text-white' :
                 'bg-slate-900 text-white';

      return (
        <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-sm font-medium ${bg} transition-all`}>
          <span>{message}</span>
          <button onClick={onClose} className="opacity-80 hover:opacity-100 font-bold ml-2">✕</button>
        </div>
      );
    }

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('summarize');

      // Editor & Output State
      const [inputText, setInputText] = useState('');
      const [summaryResult, setSummaryResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Model Settings
      const [engineMethod, setEngineMethod] = useState('auto');
      const [modelChoice, setModelChoice] = useState('bart');
      const [summaryMode, setSummaryMode] = useState('balanced');

      // Lists
      const [summariesList, setSummariesList] = useState([]);
      const [documentsList, setDocumentsList] = useState([]);
      const [historySearch, setHistorySearch] = useState('');

      // Standalone ROUGE
      const [rougeRef, setRougeRef] = useState('');
      const [rougeCand, setRougeCand] = useState('');
      const [rougeScores, setRougeScores] = useState(null);

      // Speech Synthesis
      const [isSpeaking, setIsSpeaking] = useState(false);

      const showToast = (msg, type = 'info') => setToast({ message: msg, type });

      useEffect(() => {
        fetchSummaries();
        fetchDocuments();
      }, []);

      const fetchSummaries = async () => {
        try {
          const res = await fetch('/api/summaries?limit=50');
          if (res.ok) {
            const d = await res.json();
            setSummariesList(d.summaries || []);
          }
        } catch (e) {}
      };

      const fetchDocuments = async () => {
        try {
          const res = await fetch('/api/documents?limit=50');
          if (res.ok) {
            const d = await res.json();
            setDocumentsList(d.documents || []);
          }
        } catch (e) {}
      };

      // Summarize
      const handleSummarize = async () => {
        if (!inputText.trim()) {
          showToast("Please enter text or upload a document.", "error");
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: inputText,
              mode: summaryMode,
              method: engineMethod,
              model_name: modelChoice
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Summarization request failed");
          }

          const data = await res.json();
          setSummaryResult(data);
          showToast("Summary generated successfully!", "success");
          fetchSummaries();
        } catch (e) {
          showToast(e.message, "error");
        } finally {
          setIsLoading(false);
        }
      };

      // File Upload
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        setUploadLoading(true);
        try {
          const res = await fetch('/api/upload', { method: 'POST', body: formData });
          if (!res.ok) throw new Error("Could not extract file text");
          const data = await res.json();
          setInputText(data.text || '');
          showToast(`Uploaded ${data.filename}`, "success");
          fetchDocuments();
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setUploadLoading(false);
          e.target.value = '';
        }
      };

      // Delete Summary
      const handleDeleteSummary = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Delete this summary from history?")) return;
        try {
          const res = await fetch(`/api/summaries/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Summary removed.", "info");
            fetchSummaries();
          }
        } catch (err) {}
      };

      // Delete Document
      const handleDeleteDoc = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Delete this document?")) return;
        try {
          const res = await fetch(`/api/documents/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Document deleted.", "info");
            fetchDocuments();
          }
        } catch (err) {}
      };

      // Compute ROUGE
      const handleComputeRouge = async () => {
        if (!rougeRef.trim() || !rougeCand.trim()) {
          showToast("Please provide reference and summary text.", "error");
          return;
        }
        try {
          const res = await fetch('/api/rouge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reference: rougeRef, summary: rougeCand })
          });
          if (res.ok) {
            const data = await res.json();
            setRougeScores(data.rouge);
            showToast("ROUGE scores calculated!", "success");
          }
        } catch (e) {}
      };

      // Text to Speech
      const handleSpeak = (text) => {
        if (!('speechSynthesis' in window)) {
          showToast("Text-to-speech not supported on this browser.", "error");
          return;
        }
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        window.speechSynthesis.speak(utterance);
        setIsSpeaking(true);
      };

      // Copy & Export
      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        showToast("Copied to clipboard!", "success");
      };

      const exportTxt = (text) => {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `LexiBrief_Summary.txt`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Downloaded TXT file.", "success");
      };

      const exportJson = (data) => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `LexiBrief_Data.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Exported JSON.", "success");
      };

      // Computed Input Stats
      const stats = useMemo(() => {
        const words = inputText.trim() ? inputText.trim().split(/\s+/).length : 0;
        const chars = inputText.length;
        const sentences = inputText.trim() ? (inputText.match(/[^.!?]+[.!?]+/g) || [inputText]).length : 0;
        const readingTime = Math.ceil(words / 200 * 60);
        return { words, chars, sentences, readingTime };
      }, [inputText]);

      // Filtered Summaries
      const filteredSummaries = useMemo(() => {
        if (!historySearch.trim()) return summariesList;
        const q = historySearch.toLowerCase();
        return summariesList.filter(s =>
          (s.summary && s.summary.toLowerCase().includes(q)) ||
          (s.text_snippet && s.text_snippet.toLowerCase().includes(q))
        );
      }, [summariesList, historySearch]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          
          {/* Top Clean Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 card-shadow">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                  L
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-lg font-bold text-slate-900 tracking-tight font-heading">
                      LexiBrief
                    </span>
                    <span className="text-xs font-semibold text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                      AI Summarizer
                    </span>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1.5">
                {[
                  { id: 'summarize', label: 'Summarize', icon: '✨' },
                  { id: 'documents', label: 'Documents', icon: '📄', count: documentsList.length },
                  { id: 'history', label: 'History', icon: '🕘', count: summariesList.length },
                  { id: 'benchmarks', label: 'ROUGE Metrics', icon: '📊' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                      activeTab === tab.id
                        ? 'bg-slate-100 text-indigo-600 font-bold'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                    {tab.count !== undefined && tab.count > 0 && (
                      <span className="text-[11px] px-1.5 py-0.2 bg-slate-200 text-slate-700 rounded-full font-semibold">
                        {tab.count}
                      </span>
                    )}
                  </button>
                ))}
              </nav>

            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">

            {/* TAB 1: SUMMARIZE */}
            {activeTab === 'summarize' && (
              <div className="space-y-5">
                
                {/* Control Toolbar */}
                <div className="bg-white border border-slate-200/80 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-4 card-shadow">
                  
                  {/* Left: Length Mode Switcher */}
                  <div className="flex items-center gap-2 text-xs">
                    <span className="text-slate-600 font-semibold">Summary Length:</span>
                    <div className="inline-flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                      {['concise', 'balanced', 'detailed'].map(m => (
                        <button
                          key={m}
                          onClick={() => setSummaryMode(m)}
                          className={`px-3 py-1.5 text-xs font-medium capitalize rounded-md transition ${
                            summaryMode === m
                              ? 'bg-white text-indigo-700 font-bold shadow-xs'
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          {m}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Right: Clear Button */}
                  <div>
                    <button
                      onClick={() => { setInputText(''); setSummaryResult(null); }}
                      className="text-xs font-semibold text-slate-500 hover:text-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 transition"
                      title="Clear Editor"
                    >
                      Clear
                    </button>
                  </div>

                </div>

                {/* 2-Column Clean Workspace */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  
                  {/* Left Column: Source Text Input */}
                  <div className="bg-white border border-slate-200/80 rounded-2xl p-5 flex flex-col justify-between space-y-4 card-shadow">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-indigo-600"></span>
                          <span className="text-sm font-bold text-slate-800 font-heading tracking-tight">Source Document</span>
                        </div>
                        
                        {/* Upload Button */}
                        <label className="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 border border-slate-200 text-xs font-semibold text-slate-700 transition">
                          <span>{uploadLoading ? '⏳ Reading...' : '📄 Upload PDF / DOCX / TXT'}</span>
                          <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} disabled={uploadLoading} className="hidden" />
                        </label>
                      </div>

                      <textarea
                        value={inputText}
                        onChange={(e) => setInputText(e.target.value)}
                        placeholder="Paste or type text to summarize here..."
                        className="w-full h-84 p-4 rounded-xl bg-slate-50/70 border border-slate-200 text-slate-800 text-sm leading-relaxed placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/20 resize-none transition"
                      />
                    </div>

                    {/* Footer Stats & Summarize Button */}
                    <div className="flex items-center justify-between pt-3 border-t border-slate-100">
                      <div className="flex items-center gap-3 text-xs text-slate-600 font-medium">
                        <span><b>{stats.words}</b> words</span>
                        <span>•</span>
                        <span><b>{stats.chars}</b> chars</span>
                        <span>•</span>
                        <span>~<b>{stats.readingTime}</b>s read</span>
                      </div>

                      <button
                        onClick={handleSummarize}
                        disabled={isLoading || !inputText.trim()}
                        className={`px-6 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm ${
                          isLoading || !inputText.trim()
                            ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                            : 'bg-indigo-600 hover:bg-indigo-700 text-white active:scale-98'
                        }`}
                      >
                        {isLoading ? (
                          <>
                            <span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
                            <span>Summarizing...</span>
                          </>
                        ) : (
                          <span>✨ Summarize</span>
                        )}
                      </button>
                    </div>
                  </div>

                  {/* Right Column: Generated Summary Result */}
                  <div className="bg-white border border-slate-200/80 rounded-2xl p-5 flex flex-col justify-between space-y-4 card-shadow">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                          <span className="text-sm font-bold text-slate-800 font-heading tracking-tight">Generated Summary</span>
                        </div>
                        {summaryResult && (
                          <span className="text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-0.5 rounded-md">
                            {summaryResult.method_used}
                          </span>
                        )}
                      </div>

                      {summaryResult ? (
                        <div className="space-y-4">
                          
                          {/* Summary Output Box */}
                          <div className="p-4 rounded-xl bg-slate-50/70 border border-slate-200 text-slate-800 text-sm leading-relaxed min-h-[140px]">
                            {summaryResult.summary}
                          </div>

                          {/* Key Points Takeaways */}
                          {summaryResult.key_points && summaryResult.key_points.length > 0 && (
                            <div className="p-3.5 rounded-xl bg-indigo-50/50 border border-indigo-100/80 space-y-2">
                              <span className="text-xs font-bold text-indigo-900 flex items-center gap-1.5 font-heading">
                                <span>📌</span> Key Takeaways
                              </span>
                              <ul className="text-xs text-slate-700 space-y-1.5 pl-1">
                                {summaryResult.key_points.map((pt, i) => (
                                  <li key={i} className="flex items-start gap-2">
                                    <span className="text-indigo-600 font-bold">•</span>
                                    <span>{pt}</span>
                                  </li>
                                ))}
                              </ul>
                            </div>
                          )}

                          {/* Domain Keywords */}
                          {summaryResult.keywords && summaryResult.keywords.length > 0 && (
                            <div className="space-y-1.5 pt-1">
                              <span className="text-xs font-bold text-slate-600 block">Keywords:</span>
                              <div className="flex flex-wrap gap-1.5">
                                {summaryResult.keywords.map((kw, i) => (
                                  <span key={i} className="px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-700 text-xs rounded-lg font-medium">
                                    #{kw.keyword} <span className="text-slate-400 text-[10px] ml-1">{kw.count}x</span>
                                  </span>
                                ))}
                              </div>
                            </div>
                          )}

                          {/* ROUGE Scores */}
                          {summaryResult.rouge && (
                            <div className="grid grid-cols-3 gap-2.5 text-center pt-1">
                              <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                                <span className="text-[11px] text-slate-500 font-semibold block">ROUGE-1 F1</span>
                                <span className="text-base font-bold text-indigo-600">{(summaryResult.rouge.rouge1.f1 * 100).toFixed(1)}%</span>
                              </div>
                              <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                                <span className="text-[11px] text-slate-500 font-semibold block">ROUGE-2 F1</span>
                                <span className="text-base font-bold text-indigo-600">{(summaryResult.rouge.rouge2.f1 * 100).toFixed(1)}%</span>
                              </div>
                              <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                                <span className="text-[11px] text-slate-500 font-semibold block">ROUGE-L F1</span>
                                <span className="text-base font-bold text-emerald-600">{(summaryResult.rouge.rougeL.f1 * 100).toFixed(1)}%</span>
                              </div>
                            </div>
                          )}

                        </div>
                      ) : (
                        <div className="h-84 flex flex-col items-center justify-center text-center p-6 border-2 border-dashed border-slate-200 rounded-xl text-slate-400">
                          <span className="text-3xl mb-2">📄</span>
                          <span className="text-sm font-bold text-slate-700">Summary will appear here</span>
                          <span className="text-xs text-slate-500 max-w-xs mt-1">
                            Type or paste your text on the left, then click Summarize to generate an abstractive or extractive summary.
                          </span>
                        </div>
                      )}
                    </div>

                    {/* Toolbar Actions */}
                    {summaryResult && (
                      <div className="flex items-center justify-between pt-3 border-t border-slate-100 text-xs">
                        <div className="text-slate-600 font-medium">
                          📉 <span className="text-emerald-700 font-bold">{summaryResult.analytics?.compression_ratio}</span> compressed • {summaryResult.analytics?.latency_ms}ms
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => handleSpeak(summaryResult.summary)}
                            className={`px-3 py-1.5 rounded-lg border text-xs font-semibold transition ${
                              isSpeaking ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                            }`}
                            title="Listen"
                          >
                            {isSpeaking ? '⏹️ Stop' : '🔊 Listen'}
                          </button>

                          <button
                            onClick={() => copyToClipboard(summaryResult.summary)}
                            className="px-3 py-1.5 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-semibold transition"
                          >
                            📋 Copy
                          </button>

                          <button
                            onClick={() => exportTxt(summaryResult.summary)}
                            className="px-3 py-1.5 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-semibold transition"
                          >
                            📥 TXT
                          </button>

                          <button
                            onClick={() => exportJson(summaryResult)}
                            className="px-3 py-1.5 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-semibold transition"
                          >
                            💾 JSON
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                </div>

                {/* NLP Comparison Statistics */}
                {summaryResult && (
                  <div className="bg-white border border-slate-200/80 rounded-2xl p-4 card-shadow">
                    <span className="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-3 font-heading">
                      📊 NLP Comparison Statistics
                    </span>
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center text-xs">
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="text-slate-500 text-xs block mb-1">Source Words</span>
                        <span className="font-bold text-slate-900 text-base">{summaryResult.analytics?.original_words}</span>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="text-slate-500 text-xs block mb-1">Summary Words</span>
                        <span className="font-bold text-indigo-600 text-base">{summaryResult.analytics?.summary_words}</span>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="text-slate-500 text-xs block mb-1">Time Saved</span>
                        <span className="font-bold text-emerald-600 text-base">{summaryResult.analytics?.estimated_read_time_saved}</span>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="text-slate-500 text-xs block mb-1">Source Readability</span>
                        <span className="font-bold text-slate-900 text-base">{summaryResult.nlp_stats?.readability_score || 72.5}</span>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="text-slate-500 text-xs block mb-1">Summary Readability</span>
                        <span className="font-bold text-indigo-600 text-base">{summaryResult.summary_stats?.readability_score || 78.0}</span>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* TAB 2: DOCUMENTS */}
            {activeTab === 'documents' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-slate-900 font-heading">Uploaded Documents</h2>
                  
                  <label className="cursor-pointer px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition shadow-sm">
                    <span>+ Upload Document</span>
                    <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>

                {documentsList.length === 0 ? (
                  <div className="bg-white border border-slate-200 rounded-2xl p-12 text-center text-sm text-slate-500 card-shadow">
                    No documents uploaded yet.
                  </div>
                ) : (
                  <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden divide-y divide-slate-100 card-shadow">
                    {documentsList.map(doc => (
                      <div key={doc._id} className="p-4 flex items-center justify-between gap-4 hover:bg-slate-50 transition">
                        <div className="space-y-1">
                          <div className="flex items-center gap-2.5">
                            <span className="px-2 py-0.5 bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-md">
                              {doc.format || 'TXT'}
                            </span>
                            <span className="text-sm font-bold text-slate-900">{doc.filename}</span>
                          </div>
                          <div className="text-xs text-slate-500 font-medium">
                            {doc.words} words • {doc.sentences} sentences • {doc.uploaded_at}
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={async () => {
                              try {
                                const res = await fetch(`/api/documents/${doc._id}`);
                                const full = await res.json();
                                setInputText(full.text_content || '');
                                setActiveTab('summarize');
                                showToast(`Loaded ${doc.filename}`, "info");
                              } catch (e) {}
                            }}
                            className="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg text-xs font-semibold transition"
                          >
                            Summarize
                          </button>
                          <button
                            onClick={(e) => handleDeleteDoc(doc._id, e)}
                            className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition"
                            title="Delete"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: HISTORY */}
            {activeTab === 'history' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between gap-4">
                  <h2 className="text-base font-bold text-slate-900 font-heading">Summary History</h2>
                  
                  <input
                    type="text"
                    value={historySearch}
                    onChange={(e) => setHistorySearch(e.target.value)}
                    placeholder="Search history..."
                    className="bg-white border border-slate-200 text-slate-800 text-xs px-3.5 py-2 rounded-xl focus:outline-none focus:border-indigo-500 w-64 card-shadow"
                  />
                </div>

                {filteredSummaries.length === 0 ? (
                  <div className="bg-white border border-slate-200 rounded-2xl p-12 text-center text-sm text-slate-500 card-shadow">
                    No summary history found.
                  </div>
                ) : (
                  <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden divide-y divide-slate-100 card-shadow">
                    {filteredSummaries.map(item => (
                      <div key={item._id} className="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:bg-slate-50 transition">
                        <div className="space-y-1.5 max-w-xl">
                          <div className="flex items-center gap-2 text-xs text-slate-500 font-medium">
                            <span className="font-bold text-indigo-600">{item.method || 'Auto'}</span>
                            <span>•</span>
                            <span>{item.created_at}</span>
                            <span>•</span>
                            <span className="text-emerald-700 font-bold">{item.compression_ratio} compression</span>
                          </div>
                          <p className="text-xs text-slate-800 line-clamp-2 leading-relaxed font-sans">{item.summary}</p>
                        </div>

                        <div className="flex items-center gap-2 self-end sm:self-center">
                          <button
                            onClick={async () => {
                              try {
                                const res = await fetch(`/api/summaries/${item._id}`);
                                const full = await res.json();
                                setInputText(full.full_text || full.text_snippet || '');
                                setSummaryResult(full);
                                setActiveTab('summarize');
                                showToast("Loaded into editor", "info");
                              } catch (e) {}
                            }}
                            className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold rounded-lg transition"
                          >
                            Re-Open
                          </button>

                          <button
                            onClick={() => exportTxt(item.summary)}
                            className="p-1.5 text-slate-400 hover:text-slate-700 rounded-lg transition"
                            title="Download TXT"
                          >
                            📥
                          </button>

                          <button
                            onClick={(e) => handleDeleteSummary(item._id, e)}
                            className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition"
                            title="Delete"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: ROUGE BENCHMARKS */}
            {activeTab === 'benchmarks' && (
              <div className="space-y-5">
                <h2 className="text-base font-bold text-slate-900 font-heading">ROUGE Benchmark Evaluator</h2>

                {/* Pretrained Benchmark Scores */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 card-shadow">
                    <span className="text-sm font-bold text-slate-900 block mb-3 font-heading">BART Seq2Seq (SAMSum)</span>
                    <div className="grid grid-cols-3 gap-2.5 text-center text-xs">
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span className="text-slate-500 text-xs block mb-1">ROUGE-1</span>
                        <span className="font-bold text-indigo-600 text-base">44.2%</span>
                      </div>
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span className="text-slate-500 text-xs block mb-1">ROUGE-2</span>
                        <span className="font-bold text-indigo-600 text-base">21.8%</span>
                      </div>
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span className="text-slate-500 text-xs block mb-1">ROUGE-L</span>
                        <span className="font-bold text-emerald-600 text-base">36.8%</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-5 card-shadow">
                    <span className="text-sm font-bold text-slate-900 block mb-3 font-heading">Google Pegasus (CNN/DailyMail)</span>
                    <div className="grid grid-cols-3 gap-2.5 text-center text-xs">
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span className="text-slate-500 text-xs block mb-1">ROUGE-1</span>
                        <span className="font-bold text-indigo-600 text-base">43.5%</span>
                      </div>
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span className="text-slate-500 text-xs block mb-1">ROUGE-2</span>
                        <span className="font-bold text-indigo-600 text-base">20.1%</span>
                      </div>
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span className="text-slate-500 text-xs block mb-1">ROUGE-L</span>
                        <span className="font-bold text-emerald-600 text-base">35.4%</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Custom Pair Calculator */}
                <div className="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 card-shadow">
                  <span className="text-sm font-bold text-slate-900 block font-heading">Custom Pair Evaluator</span>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div>
                      <label className="text-slate-600 font-semibold mb-1.5 block">Reference Text:</label>
                      <textarea
                        value={rougeRef}
                        onChange={(e) => setRougeRef(e.target.value)}
                        placeholder="Paste reference text here..."
                        className="w-full h-32 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm leading-relaxed focus:bg-white focus:outline-none focus:border-indigo-500 resize-none transition"
                      />
                    </div>
                    <div>
                      <label className="text-slate-600 font-semibold mb-1.5 block">Summary Candidate:</label>
                      <textarea
                        value={rougeCand}
                        onChange={(e) => setRougeCand(e.target.value)}
                        placeholder="Paste summary candidate here..."
                        className="w-full h-32 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-sm leading-relaxed focus:bg-white focus:outline-none focus:border-indigo-500 resize-none transition"
                      />
                    </div>
                  </div>

                  <button
                    onClick={handleComputeRouge}
                    className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition shadow-sm"
                  >
                    Compute ROUGE Scores
                  </button>

                  {rougeScores && (
                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 grid grid-cols-3 gap-3 text-center text-xs">
                      <div>
                        <span className="text-slate-500 text-xs block font-semibold mb-1">ROUGE-1 (Unigram)</span>
                        <span className="text-lg font-bold text-indigo-600 block mb-0.5">{(rougeScores.rouge1.f1 * 100).toFixed(1)}% F1</span>
                        <span className="text-[11px] text-slate-500 block">P: {(rougeScores.rouge1.precision * 100).toFixed(1)}% • R: {(rougeScores.rouge1.recall * 100).toFixed(1)}%</span>
                      </div>
                      <div>
                        <span className="text-slate-500 text-xs block font-semibold mb-1">ROUGE-2 (Bigram)</span>
                        <span className="text-lg font-bold text-indigo-600 block mb-0.5">{(rougeScores.rouge2.f1 * 100).toFixed(1)}% F1</span>
                        <span className="text-[11px] text-slate-500 block">P: {(rougeScores.rouge2.precision * 100).toFixed(1)}% • R: {(rougeScores.rouge2.recall * 100).toFixed(1)}%</span>
                      </div>
                      <div>
                        <span className="text-slate-500 text-xs block font-semibold mb-1">ROUGE-L (LCS)</span>
                        <span className="text-lg font-bold text-emerald-600 block mb-0.5">{(rougeScores.rougeL.f1 * 100).toFixed(1)}% F1</span>
                        <span className="text-[11px] text-slate-500 block">P: {(rougeScores.rougeL.precision * 100).toFixed(1)}% • R: {(rougeScores.rougeL.recall * 100).toFixed(1)}%</span>
                      </div>
                    </div>
                  )}
                </div>

              </div>
            )}

          </main>

          {/* Toast Notification */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}

          {/* Enhanced Clean Footer */}
          <footer className="border-t border-slate-200/80 bg-white py-6 mt-8">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
              <div className="flex items-center gap-2 font-medium">
                <div className="w-5 h-5 rounded-md bg-indigo-600 flex items-center justify-center text-[10px] text-white font-bold">L</div>
                <span className="font-bold text-slate-800">LexiBrief</span>
                <span className="text-slate-300">•</span>
                <span>AI Text Summarizer & NLP Platform</span>
              </div>
              <div className="text-slate-400 text-[11px]">
                Extractive & Deep Abstractive Neural Synthesis
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiBrief - AI Text Summarizer</title>
  <meta name="description" content="Simple, fast, and powerful AI text summarization with Extractive & Transformer engines, MongoDB persistence, and ROUGE evaluation." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }
    .custom-shadow {
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
    }
    .custom-shadow-md {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Lightweight Toast
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 3500);
        return () => clearTimeout(t);
      }, [onClose]);

      const bg = type === 'error' ? 'bg-rose-600 text-white' :
                 type === 'success' ? 'bg-emerald-600 text-white' :
                 'bg-slate-800 text-white';

      return (
        <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-2.5 rounded-lg shadow-lg text-xs font-medium ${bg} transition-all`}>
          <span>{message}</span>
          <button onClick={onClose} className="opacity-80 hover:opacity-100 font-bold ml-1">✕</button>
        </div>
      );
    }

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('summarize'); // summarize, documents, history, benchmarks

      // Editor State
      const [inputText, setInputText] = useState('');
      const [summaryResult, setSummaryResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Model Settings
      const [engineMethod, setEngineMethod] = useState('auto'); // auto, abstractive, extractive
      const [modelChoice, setModelChoice] = useState('bart'); // bart, t5, pegasus
      const [summaryMode, setSummaryMode] = useState('balanced'); // concise, balanced, detailed

      // Data Lists
      const [summariesList, setSummariesList] = useState([]);
      const [documentsList, setDocumentsList] = useState([]);
      const [presets, setPresets] = useState([]);
      const [historySearch, setHistorySearch] = useState('');

      // Standalone ROUGE
      const [rougeRef, setRougeRef] = useState('');
      const [rougeCand, setRougeCand] = useState('');
      const [rougeScores, setRougeScores] = useState(null);

      // Speech TTS
      const [isSpeaking, setIsSpeaking] = useState(false);

      const showToast = (msg, type = 'info') => setToast({ message: msg, type });

      useEffect(() => {
        fetchPresets();
        fetchSummaries();
        fetchDocuments();
      }, []);

      const fetchPresets = async () => {
        try {
          const res = await fetch('/api/presets');
          if (res.ok) {
            const d = await res.json();
            setPresets(d.presets || []);
          }
        } catch (e) {}
      };

      const fetchSummaries = async () => {
        try {
          const res = await fetch('/api/summaries?limit=50');
          if (res.ok) {
            const d = await res.json();
            setSummariesList(d.summaries || []);
          }
        } catch (e) {}
      };

      const fetchDocuments = async () => {
        try {
          const res = await fetch('/api/documents?limit=50');
          if (res.ok) {
            const d = await res.json();
            setDocumentsList(d.documents || []);
          }
        } catch (e) {}
      };

      // Execute Summarization
      const handleSummarize = async () => {
        if (!inputText.trim()) {
          showToast("Please enter text or upload a document to summarize.", "error");
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: inputText,
              mode: summaryMode,
              method: engineMethod,
              model_name: modelChoice
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Summarization failed");
          }

          const data = await res.json();
          setSummaryResult(data);
          showToast("Summary created & saved to database!", "success");
          fetchSummaries();
        } catch (e) {
          showToast(e.message, "error");
        } finally {
          setIsLoading(false);
        }
      };

      // File Upload
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        setUploadLoading(true);
        try {
          const res = await fetch('/api/upload', { method: 'POST', body: formData });
          if (!res.ok) throw new Error("Could not extract file text");
          const data = await res.json();
          setInputText(data.text || '');
          showToast(`Uploaded ${data.filename}`, "success");
          fetchDocuments();
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setUploadLoading(false);
          e.target.value = '';
        }
      };

      // Delete Summary
      const handleDeleteSummary = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Delete this summary from history?")) return;
        try {
          const res = await fetch(`/api/summaries/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Summary removed.", "info");
            fetchSummaries();
          }
        } catch (err) {}
      };

      // Delete Document
      const handleDeleteDoc = async (id, e) => {
        e?.stopPropagation();
        if (!confirm("Delete this document?")) return;
        try {
          const res = await fetch(`/api/documents/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast("Document deleted.", "info");
            fetchDocuments();
          }
        } catch (err) {}
      };

      // Standalone ROUGE
      const handleComputeRouge = async () => {
        if (!rougeRef.trim() || !rougeCand.trim()) {
          showToast("Please provide reference and summary text.", "error");
          return;
        }
        try {
          const res = await fetch('/api/rouge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reference: rougeRef, summary: rougeCand })
          });
          if (res.ok) {
            const data = await res.json();
            setRougeScores(data.rouge);
            showToast("ROUGE scores calculated!", "success");
          }
        } catch (e) {}
      };

      // Text to Speech
      const handleSpeak = (text) => {
        if (!('speechSynthesis' in window)) {
          showToast("Text-to-speech not supported on this browser.", "error");
          return;
        }
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        window.speechSynthesis.speak(utterance);
        setIsSpeaking(true);
      };

      // Copy & Export
      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        showToast("Copied to clipboard!", "success");
      };

      const exportTxt = (text) => {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Summary_${new Date().toISOString().slice(0, 10)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Downloaded TXT file.", "success");
      };

      const exportJson = (data) => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `LexiBrief_Data_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Exported JSON.", "success");
      };

      // Input Stats
      const stats = useMemo(() => {
        const words = inputText.trim() ? inputText.trim().split(/\s+/).length : 0;
        const chars = inputText.length;
        const sentences = inputText.trim() ? (inputText.match(/[^.!?]+[.!?]+/g) || [inputText]).length : 0;
        const readingTime = Math.ceil(words / 200 * 60);
        return { words, chars, sentences, readingTime };
      }, [inputText]);

      // Filtered Summaries
      const filteredSummaries = useMemo(() => {
        if (!historySearch.trim()) return summariesList;
        const q = historySearch.toLowerCase();
        return summariesList.filter(s =>
          (s.summary && s.summary.toLowerCase().includes(q)) ||
          (s.text_snippet && s.text_snippet.toLowerCase().includes(q))
        );
      }, [summariesList, historySearch]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          
          {/* Clean Light Navbar */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-base shadow-sm">
                  L
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-base font-bold text-slate-900 tracking-tight">LexiBrief</span>
                  <span className="text-[11px] font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">
                    AI Summarizer
                  </span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1">
                {[
                  { id: 'summarize', label: 'Summarize', icon: '✨' },
                  { id: 'documents', label: 'Documents', icon: '📄', count: documentsList.length },
                  { id: 'history', label: 'History', icon: '🕘', count: summariesList.length },
                  { id: 'benchmarks', label: 'ROUGE Metrics', icon: '📊' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${
                      activeTab === tab.id
                        ? 'bg-slate-100 text-indigo-700 font-bold'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                    {tab.count !== undefined && tab.count > 0 && (
                      <span className="text-[10px] px-1.5 py-0.2 bg-slate-200 text-slate-700 rounded-full font-mono">
                        {tab.count}
                      </span>
                    )}
                  </button>
                ))}
              </nav>

            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">

            {/* TAB 1: SUMMARIZE */}
            {activeTab === 'summarize' && (
              <div className="space-y-4">
                
                {/* Simplified Controls Bar */}
                <div className="bg-white border border-slate-200 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-xs">
                  
                  {/* Left: Engine & Mode */}
                  <div className="flex flex-wrap items-center gap-3">
                    
                    {/* Method Selector */}
                    <div className="flex items-center gap-1.5 text-xs">
                      <span className="text-slate-500 font-medium">Method:</span>
                      <select
                        value={engineMethod}
                        onChange={(e) => setEngineMethod(e.target.value)}
                        className="bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium py-1 px-2 rounded-lg focus:outline-none focus:border-indigo-500 cursor-pointer"
                      >
                        <option value="auto">Auto (Hybrid)</option>
                        <option value="extractive">Extractive (TF-IDF Saliency)</option>
                        <option value="abstractive">Abstractive (Transformer)</option>
                      </select>
                    </div>

                    {/* Transformer Model */}
                    {(engineMethod === 'abstractive' || engineMethod === 'auto') && (
                      <div className="flex items-center gap-1.5 text-xs">
                        <span className="text-slate-500 font-medium">Model:</span>
                        <select
                          value={modelChoice}
                          onChange={(e) => setModelChoice(e.target.value)}
                          className="bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium py-1 px-2 rounded-lg focus:outline-none focus:border-indigo-500 cursor-pointer"
                        >
                          <option value="bart">BART (DistilBART-CNN)</option>
                          <option value="bart-large">BART Large (Facebook)</option>
                          <option value="t5">Google T5 (T5-Small)</option>
                          <option value="pegasus">Google Pegasus</option>
                        </select>
                      </div>
                    )}

                    {/* Mode Toggle */}
                    <div className="flex items-center gap-1.5 text-xs">
                      <span className="text-slate-500 font-medium">Length:</span>
                      <div className="inline-flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                        {['concise', 'balanced', 'detailed'].map(m => (
                          <button
                            key={m}
                            onClick={() => setSummaryMode(m)}
                            className={`px-2.5 py-1 text-xs font-medium capitalize rounded-md transition ${
                              summaryMode === m
                                ? 'bg-white text-indigo-700 font-bold shadow-xs'
                                : 'text-slate-600 hover:text-slate-900'
                            }`}
                          >
                            {m}
                          </button>
                        ))}
                      </div>
                    </div>

                  </div>

                  {/* Right: Presets & Clear */}
                  <div className="flex items-center gap-2">
                    <select
                      onChange={(e) => {
                        const sel = presets.find(p => p.id === e.target.value);
                        if (sel) {
                          setInputText(sel.text);
                          showToast(`Loaded "${sel.title}"`, "info");
                        }
                      }}
                      defaultValue=""
                      className="bg-slate-50 border border-slate-200 text-slate-600 text-xs py-1 px-2 rounded-lg cursor-pointer focus:outline-none"
                    >
                      <option value="" disabled>Load Sample Text...</option>
                      {presets.map(p => (
                        <option key={p.id} value={p.id}>{p.title}</option>
                      ))}
                    </select>

                    <button
                      onClick={() => { setInputText(''); setSummaryResult(null); }}
                      className="text-xs text-slate-400 hover:text-slate-700 px-2 py-1 rounded transition"
                      title="Clear Text"
                    >
                      Clear
                    </button>
                  </div>

                </div>

                {/* 2-Column Clean Workspace */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  
                  {/* Left: Input Text Card */}
                  <div className="bg-white border border-slate-200 rounded-xl p-4 flex flex-col justify-between space-y-3 shadow-xs">
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-slate-800 uppercase tracking-wider">Source Document</span>
                        
                        {/* Upload File */}
                        <label className="cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 border border-slate-200 text-xs font-semibold text-slate-700 transition">
                          <span>{uploadLoading ? '⏳ Reading...' : '📄 Upload PDF / DOCX / TXT'}</span>
                          <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} disabled={uploadLoading} className="hidden" />
                        </label>
                      </div>

                      <textarea
                        value={inputText}
                        onChange={(e) => setInputText(e.target.value)}
                        placeholder="Paste or type text to summarize here..."
                        className="w-full h-80 p-3.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-900 text-sm placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-500 leading-relaxed resize-none transition"
                      />
                    </div>

                    {/* Footer Stats & Button */}
                    <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                      <div className="text-xs text-slate-500 font-mono">
                        {stats.words} words • {stats.chars} chars • ~{stats.readingTime}s read
                      </div>

                      <button
                        onClick={handleSummarize}
                        disabled={isLoading || !inputText.trim()}
                        className={`px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-xs ${
                          isLoading || !inputText.trim()
                            ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                            : 'bg-indigo-600 hover:bg-indigo-700 text-white active:scale-98'
                        }`}
                      >
                        {isLoading ? (
                          <>
                            <span className="w-3.5 h-3.5 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
                            <span>Summarizing...</span>
                          </>
                        ) : (
                          <span>✨ Summarize</span>
                        )}
                      </button>
                    </div>
                  </div>

                  {/* Right: Summary Result Card */}
                  <div className="bg-white border border-slate-200 rounded-xl p-4 flex flex-col justify-between space-y-3 shadow-xs">
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-slate-800 uppercase tracking-wider">Generated Summary</span>
                        {summaryResult && (
                          <span className="text-[11px] font-mono font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 px-2 py-0.5 rounded">
                            {summaryResult.method_used}
                          </span>
                        )}
                      </div>

                      {summaryResult ? (
                        <div className="space-y-3">
                          
                          {/* Summary Text */}
                          <div className="p-3.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-900 text-sm leading-relaxed min-h-[140px]">
                            {summaryResult.summary}
                          </div>

                          {/* Key Points Takeaways */}
                          {summaryResult.key_points && summaryResult.key_points.length > 0 && (
                            <div className="p-3 rounded-lg bg-indigo-50/70 border border-indigo-100 space-y-1.5">
                              <span className="text-xs font-bold text-indigo-900 flex items-center gap-1.5">
                                <span>📌</span> Key Takeaways
                              </span>
                              <ul className="text-xs text-slate-700 space-y-1 pl-1">
                                {summaryResult.key_points.map((pt, i) => (
                                  <li key={i} className="flex items-start gap-1.5">
                                    <span className="text-indigo-600 font-bold">•</span>
                                    <span>{pt}</span>
                                  </li>
                                ))}
                              </ul>
                            </div>
                          )}

                          {/* Domain Keywords */}
                          {summaryResult.keywords && summaryResult.keywords.length > 0 && (
                            <div className="flex flex-wrap items-center gap-1.5 pt-1">
                              <span className="text-[11px] font-bold text-slate-500 uppercase mr-1">Keywords:</span>
                              {summaryResult.keywords.map((kw, i) => (
                                <span key={i} className="px-2 py-0.5 bg-slate-100 border border-slate-200 text-slate-700 text-[11px] rounded font-mono">
                                  #{kw.keyword} <span className="text-slate-400 text-[9px]">{kw.count}x</span>
                                </span>
                              ))}
                            </div>
                          )}

                          {/* ROUGE Mini Score Bar */}
                          {summaryResult.rouge && (
                            <div className="grid grid-cols-3 gap-2 text-center pt-1">
                              <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                                <span className="text-[10px] text-slate-500 font-semibold block">ROUGE-1 F1</span>
                                <span className="text-sm font-bold text-indigo-600">{(summaryResult.rouge.rouge1.f1 * 100).toFixed(1)}%</span>
                              </div>
                              <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                                <span className="text-[10px] text-slate-500 font-semibold block">ROUGE-2 F1</span>
                                <span className="text-sm font-bold text-indigo-600">{(summaryResult.rouge.rouge2.f1 * 100).toFixed(1)}%</span>
                              </div>
                              <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                                <span className="text-[10px] text-slate-500 font-semibold block">ROUGE-L F1</span>
                                <span className="text-sm font-bold text-emerald-600">{(summaryResult.rouge.rougeL.f1 * 100).toFixed(1)}%</span>
                              </div>
                            </div>
                          )}

                        </div>
                      ) : (
                        <div className="h-80 flex flex-col items-center justify-center text-center p-6 border border-dashed border-slate-200 rounded-lg text-slate-400">
                          <span className="text-2xl mb-1">📄</span>
                          <span className="text-xs font-semibold text-slate-600">Summary will appear here</span>
                          <span className="text-[11px] text-slate-400 max-w-xs mt-0.5">
                            Enter text on the left and click Summarize to generate an abstractive or extractive summary.
                          </span>
                        </div>
                      )}
                    </div>

                    {/* Actions & Export Toolbar */}
                    {summaryResult && (
                      <div className="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
                        <div className="text-slate-500 font-mono text-[11px]">
                          📉 <span className="text-emerald-700 font-semibold">{summaryResult.analytics?.compression_ratio}</span> compressed • {summaryResult.analytics?.latency_ms}ms
                        </div>

                        <div className="flex items-center gap-1.5">
                          {/* Audio */}
                          <button
                            onClick={() => handleSpeak(summaryResult.summary)}
                            className={`px-2.5 py-1 rounded border text-xs font-medium transition ${
                              isSpeaking ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                            }`}
                            title="Listen"
                          >
                            {isSpeaking ? '⏹️ Stop' : '🔊 Listen'}
                          </button>

                          {/* Copy */}
                          <button
                            onClick={() => copyToClipboard(summaryResult.summary)}
                            className="px-2.5 py-1 rounded bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-medium transition"
                            title="Copy Summary"
                          >
                            📋 Copy
                          </button>

                          {/* Download TXT */}
                          <button
                            onClick={() => exportTxt(summaryResult.summary)}
                            className="px-2.5 py-1 rounded bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-medium transition"
                            title="Download TXT"
                          >
                            📥 TXT
                          </button>

                          {/* Export JSON */}
                          <button
                            onClick={() => exportJson(summaryResult)}
                            className="px-2.5 py-1 rounded bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-medium transition"
                            title="Export JSON"
                          >
                            💾 JSON
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                </div>

                {/* NLP Statistics Bar */}
                {summaryResult && (
                  <div className="bg-white border border-slate-200 rounded-xl p-3.5 shadow-xs">
                    <span className="text-[11px] font-bold text-slate-700 uppercase tracking-wider block mb-2">
                      📊 NLP Comparison Statistics
                    </span>
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center text-xs">
                      <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                        <span className="text-slate-400 text-[10px] block">Source Words</span>
                        <span className="font-bold text-slate-800 text-sm">{summaryResult.analytics?.original_words}</span>
                      </div>
                      <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                        <span className="text-slate-400 text-[10px] block">Summary Words</span>
                        <span className="font-bold text-indigo-600 text-sm">{summaryResult.analytics?.summary_words}</span>
                      </div>
                      <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                        <span className="text-slate-400 text-[10px] block">Time Saved</span>
                        <span className="font-bold text-emerald-600 text-sm">{summaryResult.analytics?.estimated_read_time_saved}</span>
                      </div>
                      <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                        <span className="text-slate-400 text-[10px] block">Source Readability</span>
                        <span className="font-bold text-slate-800 text-sm">{summaryResult.nlp_stats?.readability_score || 72.5}</span>
                      </div>
                      <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                        <span className="text-slate-400 text-[10px] block">Summary Readability</span>
                        <span className="font-bold text-indigo-600 text-sm">{summaryResult.summary_stats?.readability_score || 78.0}</span>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* TAB 2: DOCUMENTS */}
            {activeTab === 'documents' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Uploaded Documents</h2>
                  
                  <label className="cursor-pointer px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition shadow-xs">
                    <span>+ Upload Document</span>
                    <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>

                {documentsList.length === 0 ? (
                  <div className="bg-white border border-slate-200 rounded-xl p-8 text-center text-xs text-slate-400">
                    No documents uploaded yet.
                  </div>
                ) : (
                  <div className="bg-white border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-100 shadow-xs">
                    {documentsList.map(doc => (
                      <div key={doc._id} className="p-3.5 flex items-center justify-between gap-4 hover:bg-slate-50 transition">
                        <div className="space-y-0.5">
                          <div className="flex items-center gap-2">
                            <span className="px-1.5 py-0.2 bg-slate-100 border border-slate-200 text-slate-700 font-mono text-[10px] font-bold rounded">
                              {doc.format || 'TXT'}
                            </span>
                            <span className="text-xs font-bold text-slate-900">{doc.filename}</span>
                          </div>
                          <div className="text-[11px] text-slate-400 font-mono">
                            {doc.words} words • {doc.sentences} sentences • {doc.uploaded_at}
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={async () => {
                              try {
                                const res = await fetch(`/api/documents/${doc._id}`);
                                const full = await res.json();
                                setInputText(full.text_content || '');
                                setActiveTab('summarize');
                                showToast(`Loaded ${doc.filename}`, "info");
                              } catch (e) {}
                            }}
                            className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium transition"
                          >
                            Summarize
                          </button>
                          <button
                            onClick={(e) => handleDeleteDoc(doc._id, e)}
                            className="p-1 text-slate-400 hover:text-rose-600 rounded transition"
                            title="Delete"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: HISTORY */}
            {activeTab === 'history' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between gap-3">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Summary History</h2>
                  
                  <input
                    type="text"
                    value={historySearch}
                    onChange={(e) => setHistorySearch(e.target.value)}
                    placeholder="Search history..."
                    className="bg-white border border-slate-200 text-slate-800 text-xs px-3 py-1.5 rounded-lg focus:outline-none focus:border-indigo-500 w-56"
                  />
                </div>

                {filteredSummaries.length === 0 ? (
                  <div className="bg-white border border-slate-200 rounded-xl p-8 text-center text-xs text-slate-400">
                    No summary history found.
                  </div>
                ) : (
                  <div className="bg-white border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-100 shadow-xs">
                    {filteredSummaries.map(item => (
                      <div key={item._id} className="p-3.5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 hover:bg-slate-50 transition">
                        <div className="space-y-1 max-w-xl">
                          <div className="flex items-center gap-2 text-[11px] text-slate-500 font-mono">
                            <span className="font-semibold text-indigo-600">{item.method || 'Auto'}</span>
                            <span>•</span>
                            <span>{item.created_at}</span>
                            <span>•</span>
                            <span className="text-emerald-600">{item.compression_ratio} compression</span>
                          </div>
                          <p className="text-xs text-slate-800 line-clamp-2 leading-relaxed">{item.summary}</p>
                        </div>

                        <div className="flex items-center gap-2 self-end sm:self-center">
                          <button
                            onClick={async () => {
                              try {
                                const res = await fetch(`/api/summaries/${item._id}`);
                                const full = await res.json();
                                setInputText(full.full_text || full.text_snippet || '');
                                setSummaryResult(full);
                                setActiveTab('summarize');
                                showToast("Loaded into editor", "info");
                              } catch (e) {}
                            }}
                            className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded transition"
                          >
                            Re-Open
                          </button>

                          <button
                            onClick={() => exportTxt(item.summary)}
                            className="p-1 text-slate-400 hover:text-slate-700 rounded transition"
                            title="Download TXT"
                          >
                            📥
                          </button>

                          <button
                            onClick={(e) => handleDeleteSummary(item._id, e)}
                            className="p-1 text-slate-400 hover:text-rose-600 rounded transition"
                            title="Delete"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: ROUGE BENCHMARKS */}
            {activeTab === 'benchmarks' && (
              <div className="space-y-4">
                <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">ROUGE Benchmark Evaluator</h2>

                {/* Pretrained Benchmark Scores */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-xs">
                    <span className="text-xs font-bold text-slate-800 block mb-2">BART Seq2Seq (SAMSum)</span>
                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="p-2 bg-slate-50 rounded-lg">
                        <span className="text-slate-400 text-[10px] block">ROUGE-1</span>
                        <span className="font-bold text-indigo-600">44.2%</span>
                      </div>
                      <div className="p-2 bg-slate-50 rounded-lg">
                        <span className="text-slate-400 text-[10px] block">ROUGE-2</span>
                        <span className="font-bold text-indigo-600">21.8%</span>
                      </div>
                      <div className="p-2 bg-slate-50 rounded-lg">
                        <span className="text-slate-400 text-[10px] block">ROUGE-L</span>
                        <span className="font-bold text-emerald-600">36.8%</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-xs">
                    <span className="text-xs font-bold text-slate-800 block mb-2">Google Pegasus (CNN/DailyMail)</span>
                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="p-2 bg-slate-50 rounded-lg">
                        <span className="text-slate-400 text-[10px] block">ROUGE-1</span>
                        <span className="font-bold text-indigo-600">43.5%</span>
                      </div>
                      <div className="p-2 bg-slate-50 rounded-lg">
                        <span className="text-slate-400 text-[10px] block">ROUGE-2</span>
                        <span className="font-bold text-indigo-600">20.1%</span>
                      </div>
                      <div className="p-2 bg-slate-50 rounded-lg">
                        <span className="text-slate-400 text-[10px] block">ROUGE-L</span>
                        <span className="font-bold text-emerald-600">35.4%</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Custom Pair Calculator */}
                <div className="bg-white border border-slate-200 rounded-xl p-4 space-y-3 shadow-xs">
                  <span className="text-xs font-bold text-slate-800 block">Custom Pair Evaluator</span>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="text-slate-500 font-medium mb-1 block">Reference Text:</label>
                      <textarea
                        value={rougeRef}
                        onChange={(e) => setRougeRef(e.target.value)}
                        placeholder="Paste reference text here..."
                        className="w-full h-28 p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:border-indigo-500 resize-none"
                      />
                    </div>
                    <div>
                      <label className="text-slate-500 font-medium mb-1 block">Summary Candidate:</label>
                      <textarea
                        value={rougeCand}
                        onChange={(e) => setRougeCand(e.target.value)}
                        placeholder="Paste summary candidate here..."
                        className="w-full h-28 p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:border-indigo-500 resize-none"
                      />
                    </div>
                  </div>

                  <button
                    onClick={handleComputeRouge}
                    className="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition"
                  >
                    Compute ROUGE Scores
                  </button>

                  {rougeScores && (
                    <div className="p-3 rounded-lg bg-slate-50 border border-slate-200 grid grid-cols-3 gap-2 text-center text-xs">
                      <div>
                        <span className="text-slate-400 text-[10px] block font-semibold">ROUGE-1 (Unigram)</span>
                        <span className="text-base font-bold text-indigo-600">{(rougeScores.rouge1.f1 * 100).toFixed(1)}% F1</span>
                        <span className="text-[10px] text-slate-500 block">P: {(rougeScores.rouge1.precision * 100).toFixed(1)}% • R: {(rougeScores.rouge1.recall * 100).toFixed(1)}%</span>
                      </div>
                      <div>
                        <span className="text-slate-400 text-[10px] block font-semibold">ROUGE-2 (Bigram)</span>
                        <span className="text-base font-bold text-indigo-600">{(rougeScores.rouge2.f1 * 100).toFixed(1)}% F1</span>
                        <span className="text-[10px] text-slate-500 block">P: {(rougeScores.rouge2.precision * 100).toFixed(1)}% • R: {(rougeScores.rouge2.recall * 100).toFixed(1)}%</span>
                      </div>
                      <div>
                        <span className="text-slate-400 text-[10px] block font-semibold">ROUGE-L (LCS)</span>
                        <span className="text-base font-bold text-emerald-600">{(rougeScores.rougeL.f1 * 100).toFixed(1)}% F1</span>
                        <span className="text-[10px] text-slate-500 block">P: {(rougeScores.rougeL.precision * 100).toFixed(1)}% • R: {(rougeScores.rougeL.recall * 100).toFixed(1)}%</span>
                      </div>
                    </div>
                  )}
                </div>

              </div>
            )}

          </main>

          {/* Toast Notification */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}

          {/* Clean Footer */}
          <footer className="border-t border-slate-200 bg-white py-3 text-center text-xs text-slate-400">
            LexiBrief NLP Engine • Fast, Extractive & Abstractive Text Summarization
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

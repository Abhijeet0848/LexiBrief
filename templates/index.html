<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiBrief - Text Summarizer</title>
  <meta name="description" content="Text Summarizer powered by Extractive TF-IDF & Deep Transformers with live MongoDB Cloud persistence." />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="icon" type="image/jpeg" href="/static/logo.jpg" />
  <link rel="apple-touch-icon" href="/static/logo.jpg" />

  <!-- Premium Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            heading: ['"Outfit"', '"Plus Jakarta Sans"', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tesseract.js for Live Camera OCR & Document Extraction -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- PDF.js for Client-Side PDF Parsing & Scanned Page OCR Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
    }
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-overflow-scrolling: touch;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    /* GPU Hardware Acceleration for smooth scrolling & no jank */
    .gpu-layer {
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
    }
    /* Premium custom smooth scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
      transition: background-color 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }
    .card-shadow {
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
    }
    .card-shadow-md {
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    }
    textarea {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      letter-spacing: -0.01em;
      scroll-behavior: smooth;
    }
    ::placeholder {
      color: #94a3b8 !important;
      opacity: 1 !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes shrinkWidth {
      from { width: 100%; }
      to { width: 0%; }
    }
    @keyframes toastSlideUp {
      from {
        opacity: 0;
        transform: translate(-50%, 16px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }
    .animate-toast-up {
      animation: toastSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: translate(-50%, 0);
    }

    /* 3D Modern Tactile Buttons & Interactive Elements */
    .btn-3d-primary {
      position: relative;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #7c3aed 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 3.5px solid #3730a3;
      box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.35), 0 2px 4px rgba(15, 23, 42, 0.1);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .btn-3d-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -2px rgba(99, 102, 241, 0.5), 0 4px 8px rgba(15, 23, 42, 0.15);
      border-bottom: 4.5px solid #312e81;
      filter: brightness(1.06);
    }
    .btn-3d-primary:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom: 1.5px solid #3730a3;
      box-shadow: 0 2px 6px -1px rgba(79, 70, 229, 0.3);
    }
    .btn-3d-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: skewX(-20deg);
      pointer-events: none;
    }
    .btn-3d-primary:hover:not(:disabled)::after {
      left: 180%;
      transition: left 0.75s ease-in-out;
    }

    /* 3D Secondary Button (Tactile Slate/White) */
    .btn-3d-secondary {
      position: relative;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom: 2.5px solid #cbd5e1;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-3d-secondary:hover:not(:disabled) {
      transform: translateY(-1.5px);
      border-color: #cbd5e1;
      border-bottom: 3.5px solid #94a3b8;
      box-shadow: 0 6px 14px -2px rgba(15, 23, 42, 0.08);
      color: #4f46e5;
    }
    .btn-3d-secondary:active:not(:disabled) {
      transform: translateY(1.5px);
      border-bottom: 1px solid #cbd5e1;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    /* 3D Nav Tabs & Interactive Pills */
    .tab-3d {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-3d:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
    }
    .tab-3d-active {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-bottom: 2.5px solid #6366f1;
      box-shadow: 0 2px 5px rgba(99, 102, 241, 0.15);
      color: #4338ca !important;
      font-weight: 800 !important;
    }

    /* Style 3: Tactile Soft-3D Studio Cards */
    .tactile-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-bottom: 3.5px solid #cbd5e1;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 4px 6px -2px rgba(15, 23, 42, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tactile-card:hover {
      border-color: #cbd5e1;
      border-bottom-color: #94a3b8;
      box-shadow: 0 16px 32px -8px rgba(15, 23, 42, 0.08);
    }

    /* Recessed Inset Digital Paper Workspace */
    .recessed-workspace {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.04), inset 0 0 0 1px rgba(0, 0, 0, 0.01);
      transition: all 0.2s ease;
    }
    .recessed-workspace:focus-within, .recessed-workspace:focus {
      background: #ffffff !important;
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12), inset 0 1px 2px rgba(0, 0, 0, 0.02) !important;
    }

    /* Tactile Structured Takeaway Card Block */
    .takeaway-block {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-left: 4px solid #6366f1;
      border-radius: 14px;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03);

      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
      border-color: #c7d2fe;
      border-left-color: #4f46e5;

    /* Tactile Monospace Tag */
    .tactile-tag {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-bottom: 2px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      transition: all 0.15s ease;
    }
    .tactile-tag:hover {
      transform: translateY(-1px);
      background: #ffffff;
      border-color: #cbd5e1;
      border-bottom-color: #94a3b8;
    }
  </style>
</head>
<body class="text-slate-900 antialiased selection:bg-indigo-600 selection:text-white min-h-screen relative overflow-x-hidden bg-slate-50">
  
  <!-- GPU-Accelerated Fixed Background Layer (Zero Scroll-Repaint Jank) -->
  <div id="bg-canvas" class="fixed inset-0 pointer-events-none -z-20 bg-cover bg-center bg-no-repeat gpu-layer" style="background-image: url('/static/background.jpg');"></div>
  
  <!-- Soft Ambient Overlay for Optimal Reading Contrast -->
  <div id="bg-overlay" class="fixed inset-0 pointer-events-none -z-10 bg-slate-50/70 gpu-layer"></div>

  <div id="root" class="relative z-10"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Modern Top Drop Box Alert Notification (Disappears in 4 seconds)
    function Toast({ message, type, duration = 4000, onClose }) {
      useEffect(() => {
        const timer = setTimeout(onClose, duration);
        return () => clearTimeout(timer);
      }, [onClose, duration, message]);

      const isError = type === 'error';
      const isSuccess = type === 'success';

      let cleanMsg = message || '';

      if (typeof message === 'string') {
        if (message.startsWith('✓ Ingested') || message.startsWith('✓ ')) {
          cleanMsg = message.replace(/^✓\s*/, '');
        } else if (message.startsWith('ℹ️') || message.includes('recognized!') || message.includes('detected')) {
          cleanMsg = message.replace(/^ℹ️\s*/, '');
        } else if (message.startsWith('⚠️')) {
          cleanMsg = message.replace(/^⚠️\s*/, '');
        } else if (message.startsWith('🎙️')) {
          cleanMsg = message.replace(/^🎙️\s*/, '');
        }
      }

      return (
        <div className="fixed bottom-20 md:bottom-8 left-1/2 z-[9999] max-w-[90vw] sm:max-w-md w-max animate-toast-up pointer-events-auto select-none">
          <div className={`relative flex items-center justify-between gap-3 px-4 py-2.5 rounded-full shadow-2xl border backdrop-blur-md transition-all duration-200 ${
            isError
              ? 'bg-rose-950/95 border-rose-800/80 text-rose-100 shadow-rose-950/40'
              : isSuccess
              ? 'bg-emerald-950/95 border-emerald-800/80 text-emerald-100 shadow-emerald-950/40'
              : 'bg-slate-900/95 border-slate-700/80 text-white shadow-slate-950/50'
          }`}>
            {/* Left Inline Status Indicator */}
            <span className={`flex-shrink-0 flex items-center justify-center ${
              isError ? 'text-rose-400' : isSuccess ? 'text-emerald-400' : 'text-indigo-400'
            }`}>
              {isError ? (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              ) : isSuccess ? (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.6" d="M5 13l4 4L19 7" />
                </svg>
              ) : (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.4" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              )}
            </span>

            {/* Clean Message Text */}
            <div className="flex-1 min-w-0 px-0.5">
              <p className="text-xs text-white font-medium leading-snug whitespace-normal break-words sm:whitespace-nowrap max-w-[65vw] sm:max-w-none">
                {cleanMsg}
              </p>
            </div>

            {/* Subtle Dismiss Button */}
            <button
              onClick={onClose}
              className="w-5 h-5 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-colors flex-shrink-0 cursor-pointer ml-1"
              title="Dismiss"
            >
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.4" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
      );
    }

    // Modern SVG Icons for Tabs & Action Buttons
    const SparklesIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/>
      </svg>
    );

    const DocumentIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    );

    const HistoryIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    );

    const ChartIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
    );

    // Real-Time Document Upload & OCR Progress Card with Cancel Option
    function UploadProgressCard({ progress, onCancel }) {
      if (!progress) return null;

      const isError = progress.stage === 'error';
      const isDone = progress.stage === 'done';
      const isProcessing = progress.stage === 'processing';
      const isUploading = progress.stage === 'uploading';

      return (
        <div className="mb-3.5 p-4 rounded-2xl bg-white border border-indigo-200/90 shadow-md backdrop-blur-md animate-fadeIn">
          <div className="flex items-center justify-between gap-3 mb-2.5">
            <div className="flex items-center gap-3 min-w-0">
              <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-2xs ${
                isError ? 'bg-rose-100 text-rose-600 border border-rose-200' :
                isDone ? 'bg-emerald-100 text-emerald-600 border border-emerald-200' :
                'bg-indigo-100 text-indigo-700 border border-indigo-200'
              }`}>
                {isError ? '✕' :
                 isDone ? '✓' :
                 progress.fileName?.toLowerCase().endsWith('.pdf') ? 'PDF' :
                 progress.fileName?.toLowerCase().endsWith('.docx') ? 'DOC' :
                 (progress.fileName?.toLowerCase().endsWith('.pptx') || progress.fileName?.toLowerCase().endsWith('.ppt')) ? 'PPT' :
                 ['.jpg', '.jpeg', '.png', '.webp', '.bmp'].some(ext => progress.fileName?.toLowerCase().endsWith(ext)) ? 'IMG' : 'TXT'}
              </div>
              <div className="min-w-0">
                <p className="text-xs font-bold text-slate-900 truncate max-w-[180px] sm:max-w-xs">
                  {progress.fileName}
                </p>
                <p className="text-[10px] text-slate-500 font-medium mt-0.5">
                  {progress.loadedSize} of {progress.totalSize}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2 flex-shrink-0">
              <span className={`text-xs font-black tracking-tight ${
                isError ? 'text-rose-600' :
                isDone ? 'text-emerald-600' :
                'text-indigo-600 font-mono'
              }`}>
                {progress.percent}%
              </span>

              {onCancel && !isDone && (
                <button
                  type="button"
                  onClick={onCancel}
                  className="px-2.5 py-1 rounded-xl text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200/90 transition-all flex items-center gap-1 cursor-pointer active:scale-95 shadow-2xs"
                  title="Cancel upload and parsing"
                >
                  <span className="text-[10px]">✕</span>
                  <span>Cancel</span>
                </button>
              )}
            </div>
          </div>

          {/* Smooth Real-time Progress Bar */}
          <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden relative shadow-inner">
            <div
              className={`h-full transition-all duration-150 ease-out rounded-full ${
                isError ? 'bg-rose-500' :
                isDone ? 'bg-emerald-500' :
                'bg-gradient-to-r from-indigo-500 via-indigo-600 to-purple-600'
              }`}
              style={{ width: `${Math.max(3, progress.percent)}%` }}
            />
          </div>

          {/* Real-time Status Details */}
          <div className="flex items-center justify-between mt-2.5 text-[11px]">
            <div className="flex items-center gap-1.5 min-w-0">
              {isUploading && (
                <span className="relative flex h-2 w-2 flex-shrink-0">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-indigo-600"></span>
                </span>
              )}
              {isProcessing && (
                <svg className="animate-spin h-3 w-3 text-indigo-600 flex-shrink-0" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
              )}
              <span className={`truncate ${
                isError ? 'text-rose-600 font-bold' :
                isDone ? 'text-emerald-700 font-bold' :
                'text-slate-600 font-medium'
              }`}>
                {progress.statusText}
              </span>
            </div>
            <span className="text-[10px] text-slate-400 font-medium flex-shrink-0 ml-2">
              {isUploading ? 'Streaming Bytes' : isProcessing ? 'OCR & Parsing' : isDone ? 'Complete' : 'Failed'}
            </span>
          </div>
        </div>
      );
    }

    // High-Clarity Image Crop & Preprocessing Pipeline
    const cropImageToDataUrl = (imageSrc, cropRect) => {
      return new Promise((resolve) => {
        if (!imageSrc || !cropRect) return resolve(imageSrc);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const nw = img.naturalWidth || img.width;
            const nh = img.naturalHeight || img.height;
            
            const sx = Math.max(0, Math.round((cropRect.x / 100) * nw));
            const sy = Math.max(0, Math.round((cropRect.y / 100) * nh));
            const sw = Math.min(nw - sx, Math.round((cropRect.width / 100) * nw));
            const sh = Math.min(nh - sy, Math.round((cropRect.height / 100) * nh));

            if (sw <= 15 || sh <= 15) return resolve(imageSrc);

            const canvas = document.createElement('canvas');
            canvas.width = sw;
            canvas.height = sh;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
            resolve(canvas.toDataURL('image/jpeg', 0.96));
          } catch (e) {
            console.warn("Crop calculation note:", e);
            resolve(imageSrc);
          }
        };
        img.onerror = () => resolve(imageSrc);
        img.src = imageSrc;
      });
    };

    // Non-destructive High-Clarity Image Preprocessor that preserves delicate Hindi matras & thin ink
    const preprocessImageForOCR = (imageSrc, mode = 'clarity') => {
      return new Promise((resolve) => {
        if (!imageSrc) return resolve('');
        if (mode === 'original') return resolve(imageSrc);

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            let width = img.naturalWidth || img.width || 1280;
            let height = img.naturalHeight || img.height || 720;

            // Upscale low-res snapshots to ensure crisp OCR glyph boundary detection
            if (width < 1100 && height < 1100) {
              const scale = Math.min(2.5, 1500 / Math.max(width, height));
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            } else if (width > 2200 || height > 2200) {
              const scale = 2200 / Math.max(width, height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            const len = data.length;

            if (mode === 'contrast' || mode === 'clarity' || mode === 'document') {
              // Calculate dynamic min/max brightness to normalize lighting across camera shots & shadows
              let minG = 255, maxG = 0;
              const step = Math.max(1, Math.floor(len / 4000)) * 4;
              for (let i = 0; i < len; i += step) {
                const g = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                if (g < minG) minG = g;
                if (g > maxG) maxG = g;
              }
              const range = Math.max(30, maxG - minG);
              for (let i = 0; i < len; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                let normalized = Math.max(0, Math.min(255, ((gray - minG) / range) * 255));
                if (mode === 'document') {
                  normalized = normalized < 135 ? normalized * 0.55 : Math.min(255, 255 - (255 - normalized) * 0.35);
                } else if (mode === 'clarity') {
                  normalized = normalized < 155 ? normalized * 0.8 : Math.min(255, 255 - (255 - normalized) * 0.5);
                }
                data[i] = normalized;
                data[i + 1] = normalized;
                data[i + 2] = normalized;
              }
            }

            ctx.putImageData(imgData, 0, 0);
            resolve(canvas.toDataURL('image/jpeg', 0.96));
          } catch (e) {
            console.warn("Image preprocessor note:", e);
            resolve(imageSrc);
          }
        };
        img.onerror = () => resolve(imageSrc);
        img.src = imageSrc;
      });
    };

    // Interactive Drag-and-Resize Crop Overlay Component
    function InteractiveImageCropper({ imageSrc, cropBox, setCropBox, isCropActive }) {
      const containerRef = React.useRef(null);
      const isDraggingRef = React.useRef(null);
      const dragStartRef = React.useRef({ x: 0, y: 0, box: null });

      const getClientPos = (e) => {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      };

      const handlePointerDown = (e, handleType) => {
        e.preventDefault();
        e.stopPropagation();
        isDraggingRef.current = handleType;
        const pos = getClientPos(e);
        dragStartRef.current = { x: pos.x, y: pos.y, box: { ...cropBox } };

        const handlePointerMove = (moveEvent) => {
          if (!isDraggingRef.current || !containerRef.current) return;
          const movePos = getClientPos(moveEvent);
          const rect = containerRef.current.getBoundingClientRect();
          const dx = ((movePos.x - dragStartRef.current.x) / rect.width) * 100;
          const dy = ((movePos.y - dragStartRef.current.y) / rect.height) * 100;
          const orig = dragStartRef.current.box;
          const type = isDraggingRef.current;

          let newBox = { ...orig };

          if (type === 'move') {
            newBox.x = Math.max(0, Math.min(100 - orig.width, orig.x + dx));
            newBox.y = Math.max(0, Math.min(100 - orig.height, orig.y + dy));
          } else {
            if (type.includes('w')) {
              const maxLeft = orig.x + orig.width - 8;
              newBox.x = Math.max(0, Math.min(maxLeft, orig.x + dx));
              newBox.width = orig.width - (newBox.x - orig.x);
            }
            if (type.includes('e')) {
              newBox.width = Math.max(8, Math.min(100 - orig.x, orig.width + dx));
            }
            if (type.includes('n')) {
              const maxTop = orig.y + orig.height - 8;
              newBox.y = Math.max(0, Math.min(maxTop, orig.y + dy));
              newBox.height = orig.height - (newBox.y - orig.y);
            }
            if (type.includes('s')) {
              newBox.height = Math.max(8, Math.min(100 - orig.y, orig.height + dy));
            }

        };

        const handlePointerUp = () => {
          isDraggingRef.current = null;

          window.removeEventListener('mouseup', handlePointerUp);
          window.removeEventListener('touchmove', handlePointerMove);

                    ${cropBox.x}% ${cropBox.y + cropBox.height}%,
                    ${cropBox.x + cropBox.width}% ${cropBox.y + cropBox.height}%,
                    ${cropBox.x + cropBox.width}% ${cropBox.y}%,

                  <div className="border-r border-b border-white/40"></div>

                <div

                />
                <div
                  className="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-6 h-3 bg-indigo-400 rounded-full cursor-ns-resize z-30 opacity-90 shadow-sm"
                  onMouseDown={(e) => handlePointerDown(e, 's')}

                <div

    // Universal Multi-Language OCR Configuration
    const OCR_LANGUAGES = [

    // Smart OCR Text Cleanser: Preserves all International Scripts (Hindi, Indic, Arabic, CJK, Cyrillic, Latin)
    const cleanOCRText = (text) => {
      if (!text) return '';
      // 1. Strip non-printable control codes while preserving valid Unicode letters, numbers, and Indic/Arabic/CJK punctuation
      let clean = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
      clean = clean.replace(/[|~_^\/\\<>{}\[\]*+=#`¬¢§±µ¿¡@$%&~]+/g, ' ');
      
      // 2. Fix English OCR digit-in-word substitutions (e.g. m0del -> model) only for Latin words
      clean = clean.replace(/\b([a-zA-Z0-9]+)\b/g, (match) => {
        if (/^\d+$/.test(match) || /^\d+[a-zA-Z]{1,2}$/.test(match)) return match;
        const alphas = (match.match(/[a-zA-Z]/g) || []).length;
        if (alphas >= 2) {
          return match
            .replace(/(?<=[a-zA-Z])0(?=[a-zA-Z])/g, 'o')
            .replace(/(?<=[a-zA-Z])1(?=[a-zA-Z])/g, 'l')
            .replace(/(?<=[a-zA-Z])3(?=[a-zA-Z])/g, 'e')
            .replace(/(?<=[a-zA-Z])5(?=[a-zA-Z])/g, 's');
        }
        return match;
      });

      // 3. Clean line by line and eliminate isolated single-character Latin noise without touching Unicode
      const lines = clean.split('\n');
      const validLines = [];
      for (let line of lines) {
        const words = line.trim().split(/\s+/);
        const validWords = [];
        for (let w of words) {
          if (w.length === 1 && /^[a-zA-Z]$/.test(w) && !['a', 'i', 'A', 'I'].includes(w)) {
            continue;
          }
          if (w) validWords.push(w);
        }
        if (validWords.length > 0) {
          validLines.push(validWords.join(' '));
        }
      }
      const res = validLines.join('\n').trim();
      return res || text.trim();
    };

    // Helper: Execute High-Precision Client OCR with Universal Multilingual Support
    const executeHandwritingOCR = async (imageSrc, onProgress, selectedLang = 'hin') => {
      if (!window.Tesseract || !imageSrc) return '';
      const langParam = selectedLang ? (selectedLang.includes('+') ? selectedLang.split('+').map(s => s.trim()).filter(Boolean) : selectedLang) : 'hin';
      const langStr = Array.isArray(langParam) ? langParam.join('+') : selectedLang;
      
      if (typeof window.Tesseract.createWorker === 'function') {
        try {
          const worker = await window.Tesseract.createWorker(langParam, 1, {
            langPath: 'https://tessdata.projectnaptha.com/4.0.0',
            logger: (m) => {
              if (m.status === 'recognizing text' && typeof m.progress === 'number') {
                const pct = Math.round(m.progress * 100);
                if (onProgress) onProgress(pct, `Recognizing text (${pct}%)...`);
              } else if (m.status && onProgress) {
                const displayStatus = m.status === 'loading tesseract core' ? 'Loading AI OCR core...'
                  : m.status === 'loading language traineddata' ? `Downloading ${langStr} model...`
                  : m.status === 'initializing api' ? 'Initializing neural models...'
                  : m.status === 'recognizing text' ? 'Scanning text...' : m.status;
                onProgress(null, displayStatus);
              }
            }
          });

          await worker.setParameters({
            tessedit_pageseg_mode: '3',
            preserve_interword_spaces: '1'
          });
          const ret = await worker.recognize(imageSrc);
          await worker.terminate();
          const raw = ret?.data?.text || '';
          return cleanOCRText(raw);
        } catch (workerErr) {
          console.warn("Worker OCR fallback to standard recognize:", workerErr);
        }
      }

      // Fallback: standard recognize with selected language
      try {
        const ret = await window.Tesseract.recognize(imageSrc, langStr, {
          langPath: 'https://tessdata.projectnaptha.com/4.0.0',
          logger: (m) => {
            if (m.status === 'recognizing text' && typeof m.progress === 'number') {
              const pct = Math.round(m.progress * 100);
              if (onProgress) onProgress(pct, `Recognizing text (${pct}%)...`);
            }
          }
        });
        return cleanOCRText(ret?.data?.text || '');
      } catch (err) {
        console.error("Tesseract recognize error:", err);
        throw err;
      }
    };

    // High-Precision Real-Time Camera Scanner & OCR Modal

      const [isCropActive, setIsCropActive] = React.useState(true);
      const [cameraError, setCameraError] = React.useState(null);
      const [isInitializing, setIsInitializing] = React.useState(true);
      const [isOcrProcessing, setIsOcrProcessing] = React.useState(false);
      const [ocrProgress, setOcrProgress] = React.useState({ status: '', percent: 0 });

          setStream(null);

        setEnhancedPreview(null);
        setExtractedTextPreview(null);
        setCropBox({ x: 2, y: 2, width: 96, height: 96 });
        setIsOcrProcessing(false);
        setOcrProgress({ status: '', percent: 0 });

      // Run OCR on captured/cropped photo and show preview
      const runExtractHandwriting = async () => {
        if (!capturedImage) return;
        setIsOcrProcessing(true);
        const langObj = OCR_LANGUAGES.find(l => l.code === ocrLang);
        setOcrProgress({ status: `Preparing OCR engine (${langObj ? langObj.short : ocrLang})...`, percent: 15 });

        try {
          // 1. Crop image if crop box is active & adjusted
          let baseImageToOcr = capturedImage;

            setOcrProgress({ status: 'Cropping selected document region...', percent: 20 });
            baseImageToOcr = await cropImageToDataUrl(capturedImage, cropBox);

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('summarize');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Editor & Output State
      const [inputText, setInputText] = useState('');
      const [summaryResult, setSummaryResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(null);
      const [toast, setToast] = useState(null);

      // Upload Cancellation Controller Refs
      const activeXhrRef = React.useRef(null);
      const uploadCancelledRef = React.useRef(false);

      const handleCancelUpload = () => {
        uploadCancelledRef.current = true;
        if (activeXhrRef.current) {
          try {
            activeXhrRef.current.abort();
          } catch (e) {}
          activeXhrRef.current = null;
        }
        setUploadLoading(false);
        setUploadProgress(null);
        showToast("Document upload cancelled.", "info");
      };

      // Model & Persona Settings
      const [engineMethod, setEngineMethod] = useState('auto');
      const [modelChoice, setModelChoice] = useState('bart');
      const [summaryMode, setSummaryMode] = useState('balanced');
      const [persona, setPersona] = useState('general'); // 'general', 'executive', 'technical', 'eli5', 'action_items'
      const [translateToEnglish, setTranslateToEnglish] = useState(false);
      const [isTranslating, setIsTranslating] = useState(false);

      // Multi-Source Ingestion & URL / YouTube / Camera State
      const [inputSourceTab, setInputSourceTab] = useState('text'); // 'text', 'upload', 'camera', 'url'
      const [showCameraModal, setShowCameraModal] = useState(false);
      const [urlInput, setUrlInput] = useState('');
      const [urlLoading, setUrlLoading] = useState(false);
      const [urlDocData, setUrlDocData] = useState(null);

      // Explainable Source Attribution Highlighting State
      const [hoveredSummarySentenceIdx, setHoveredSummarySentenceIdx] = useState(null);
      const [selectedSummarySentenceIdx, setSelectedSummarySentenceIdx] = useState(null);
      const [showAttributionInspector, setShowAttributionInspector] = useState(false);
      const [sourceViewMode, setSourceViewMode] = useState('editor'); // 'editor', 'traceability'

      // Lists & Search
      const [summariesList, setSummariesList] = useState([]);
      const [documentsList, setDocumentsList] = useState([]);
      const [historySearch, setHistorySearch] = useState('');

      // Documents Tab Advanced States
      const [docSearch, setDocSearch] = useState('');
      const [docFormatFilter, setDocFormatFilter] = useState('ALL');
      const [docViewMode, setDocViewMode] = useState('grid');
      const [previewDoc, setPreviewDoc] = useState(null);
      const [previewLoading, setPreviewLoading] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const [uploadedDocInfo, setUploadedDocInfo] = useState(null);
      const [saveLoading, setSaveLoading] = useState(false);

      // Standalone ROUGE
      const [rougeRef, setRougeRef] = useState('');
      const [rougeCand, setRougeCand] = useState('');
      const [rougeScores, setRougeScores] = useState(null);
      const [rougeLoading, setRougeLoading] = useState(false);

      // Speech Synthesis & Studio Neural Voice State
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [audioLoading, setAudioLoading] = useState(false);
      const [selectedVoice, setSelectedVoice] = useState('neerja');
      const [voices, setVoices] = useState([]);
      const audioRef = useRef(null);
      const textareaRef = useRef(null);

      // Auto-resize input textarea dynamically as content grows
      useEffect(() => {
        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
          const nextHeight = Math.max(380, textareaRef.current.scrollHeight);
          textareaRef.current.style.height = `${nextHeight}px`;
        }
      }, [inputText, sourceViewMode, inputSourceTab]);

      // Auto-dismiss uploaded document banner after 4 seconds
      useEffect(() => {
        if (uploadedDocInfo) {
          const timer = setTimeout(() => {
            setUploadedDocInfo(null);
          }, 4000);
          return () => clearTimeout(timer);
        }
      }, [uploadedDocInfo]);

      const showToast = (msg, type = 'info', duration = 4500) => setToast({ message: msg, type, duration });

      useEffect(() => {
        fetchSummaries();
        fetchDocuments();

        // Populate fallback TTS voices
        const loadVoices = () => {
          if ('speechSynthesis' in window) {
            const list = window.speechSynthesis.getVoices();
            if (list && list.length > 0) {
              setVoices(list);
            }
          }
        };
        loadVoices();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        return () => {
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current = null;
          }
        };
      }, []);

      const fetchSummaries = async () => {
        try {
          const res = await fetch('/api/summaries?limit=50');
          if (res.ok) {
            const d = await res.json();
            setSummariesList(d.summaries || []);
          }
        } catch (e) {}
      };

      const fetchDocuments = async () => {
        try {
          const res = await fetch('/api/documents?limit=50');
          if (res.ok) {
            const d = await res.json();
            setDocumentsList(d.documents || []);
          }
        } catch (e) {}
      };

      // Document Helpers
      const openDocPreview = async (doc) => {
        setPreviewLoading(true);
        try {
          const res = await fetch(`/api/documents/${doc._id}`);
          if (res.ok) {
            const fullDoc = await res.json();
            setPreviewDoc(fullDoc);
          } else {
            setPreviewDoc(doc);
          }
        } catch (e) {
          setPreviewDoc(doc);
        } finally {
          setPreviewLoading(false);
        }
      };

      const exportDocTxt = (doc, e) => {
        e?.stopPropagation();
        const text = doc.text_content || doc.text_snippet || '';
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const name = doc.filename ? `${doc.filename.replace(/\.[^/.]+$/, "")}_extracted.txt` : 'document_text.txt';
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`Downloaded ${name}`, "success");
      };

      const handleSaveSummary = async () => {
        if (!summaryResult) return;
        setSaveLoading(true);
        try {

          const payload = {

            mode: summaryMode,
            method: engineMethod,

            model_name: modelChoice,

      const uploadFileObject = async (file) => {
        if (!file) return;

        const maxSizeBytes = 50 * 1024 * 1024;
        const formatBytes = (bytes) => {
          if (!bytes || bytes <= 0) return '0 KB';
          if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
          return `${Math.max(1, Math.round(bytes / 1024))} KB`;
        };

        const totalSizeFormatted = formatBytes(file.size);

        // 1. Check for empty file
        if (file.size === 0) {
          showToast(`File "${file.name}" is empty (0 bytes). Please select a valid document.`, "error", 5000);
          return;
        }

        // 2. Pre-upload file size validation: Greater than 50 MB -> display message & abort
        if (file.size > maxSizeBytes) {
          showToast(`⚠️ File "${file.name}" (${totalSizeFormatted}) exceeds the 50 MB maximum limit. Please select a smaller file.`, "error", 6000);
          return;
        }

        // 3. Supported extension check
        const allowedExts = ['.pdf', '.docx', '.doc', '.pptx', '.ppt', '.txt', '.jpg', '.jpeg', '.png', '.webp', '.bmp'];
        const lowerName = (file.name || '').toLowerCase();
        const hasValidExt = allowedExts.some(ext => lowerName.endsWith(ext));
        if (!hasValidExt) {
          showToast(`Unsupported format for "${file.name}". Please upload PDF, DOCX, PPTX, TXT, or Images.`, "error", 5000);
          return;
        }

        const isImage = ['.jpg', '.jpeg', '.png', '.webp', '.bmp'].some(ext => lowerName.endsWith(ext));
        const isPdf = lowerName.endsWith('.pdf');

        // 4. Size within limit (<= 50 MB) -> Proceed with upload
        uploadCancelledRef.current = false;
        setUploadLoading(true);
        setUploadProgress({
          percent: 0,
          fileName: file.name,
          totalSize: totalSizeFormatted,
          loadedSize: '0 KB',
          statusText: isImage ? `Enhancing image & preparing OCR engine for "${file.name}"...` : isPdf ? `Inspecting PDF structure for "${file.name}"...` : `Connecting to server (${totalSizeFormatted})...`,
          stage: 'uploading'
        });

        let clientOcrText = '';
        if (isImage && window.Tesseract) {
          try {
            if (uploadCancelledRef.current) return;
            setUploadProgress({
              percent: 15,
              fileName: file.name,
              totalSize: totalSizeFormatted,
              loadedSize: '0 KB',
              statusText: `Enhancing contrast for handwritten notes & reading text...`,
              stage: 'processing'
            });
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            if (uploadCancelledRef.current) return;
            const enhancedUrl = await preprocessImageForOCR(dataUrl, 'document');
            if (uploadCancelledRef.current) return;
            clientOcrText = await executeHandwritingOCR(enhancedUrl, (pct, statusText) => {
              if (uploadCancelledRef.current) return;
              setUploadProgress({
                percent: pct !== null ? Math.max(15, Math.min(88, pct)) : 35,
                fileName: file.name,
                totalSize: totalSizeFormatted,
                loadedSize: totalSizeFormatted,
                statusText: statusText || (pct ? `Recognizing text (${pct}%)...` : `Processing neural OCR...`),
                stage: 'processing'
              });
            }, 'hin+eng');
          } catch (tessErr) {
            console.warn("Client image OCR notice:", tessErr);
          }
        } else if (isPdf && window.pdfjsLib && window.Tesseract) {
          try {
            if (uploadCancelledRef.current) return;
            setUploadProgress({
              percent: 10,
              fileName: file.name,
              totalSize: totalSizeFormatted,
              loadedSize: '0 KB',
              statusText: `Checking PDF pages for scanned image content...`,
              stage: 'processing'
            });

            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const arrayBuffer = await file.arrayBuffer();
            if (uploadCancelledRef.current) return;
            const pdfDoc = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const numPages = pdfDoc.numPages || 1;
            const pageInfoList = [];
            let neededOcrCount = 0;

            for (let pageNum = 1; pageNum <= numPages; pageNum++) {
              if (uploadCancelledRef.current) return;
              const page = await pdfDoc.getPage(pageNum);
              const textContent = await page.getTextContent();
              const textItems = (textContent.items || []).map(it => it.str).join(' ').trim();
              const hasText = textItems.length >= 35;
              if (!hasText) neededOcrCount++;
              pageInfoList.push({ pageNum, page, textItems, hasText });
            }

            // If scanned pages exist without digital text
            if (neededOcrCount > 0) {
              const extractedPageTexts = [];
              for (let i = 0; i < pageInfoList.length; i++) {
                if (uploadCancelledRef.current) return;
                const info = pageInfoList[i];
                if (info.hasText) {
                  extractedPageTexts.push(info.textItems);
                } else {
                  setUploadProgress({
                    percent: Math.round(15 + (i / pageInfoList.length) * 75),
                    fileName: file.name,
                    totalSize: totalSizeFormatted,
                    loadedSize: totalSizeFormatted,
                    statusText: `OCR scanning page ${info.pageNum} of ${numPages}...`,
                    stage: 'processing'
                  });

                  const viewport = info.page.getViewport({ scale: 2.0 });
                  const canvas = document.createElement('canvas');
                  canvas.width = viewport.width;
                  canvas.height = viewport.height;
                  const ctx = canvas.getContext('2d');
                  await info.page.render({ canvasContext: ctx, viewport }).promise;

                  if (uploadCancelledRef.current) return;
                  const pageDataUrl = canvas.toDataURL('image/jpeg', 0.94);
                  const enhancedUrl = await preprocessImageForOCR(pageDataUrl, 'document');
                  if (uploadCancelledRef.current) return;
                  const pageOcr = await executeHandwritingOCR(enhancedUrl, (pct, statusText) => {
                    if (uploadCancelledRef.current) return;
                    const currentPct = Math.round(15 + ((i + (pct || 0) / 100) / pageInfoList.length) * 75);
                    setUploadProgress({
                      percent: Math.max(15, Math.min(92, currentPct)),
                      fileName: file.name,
                      totalSize: totalSizeFormatted,
                      loadedSize: totalSizeFormatted,
                      statusText: `Scanning PDF page ${info.pageNum}/${numPages}: ${statusText || 'reading text...'}`,
                      stage: 'processing'
                    });
                  }, 'hin+eng');

                  if (pageOcr && pageOcr.trim()) {
                    extractedPageTexts.push(pageOcr.trim());
                  } else if (info.textItems) {
                    extractedPageTexts.push(info.textItems);
                  }
                }
              }
              clientOcrText = extractedPageTexts.join('\n\n');
            }
          } catch (pdfOcrErr) {
            console.warn("Client PDF OCR scan notice:", pdfOcrErr);
          }
        }

        if (uploadCancelledRef.current) return;

        const formData = new FormData();
        formData.append('file', file);
        if (clientOcrText && clientOcrText.trim()) {
          formData.append('ocr_text', clientOcrText.trim());
        }

        const xhr = new XMLHttpRequest();
        activeXhrRef.current = xhr;
        xhr.open('POST', '/api/upload', true);

        xhr.upload.onprogress = (event) => {
          if (uploadCancelledRef.current) return;
          if (event.lengthComputable && event.total > 0) {
            const percent = Math.min(99, Math.round((event.loaded / event.total) * 100));
            const loadedFormatted = formatBytes(event.loaded);
            const totalFormatted = formatBytes(event.total);

            setUploadProgress({
              percent,
              fileName: file.name,
              totalSize: totalFormatted,
              loadedSize: loadedFormatted,
              statusText: `Uploading ${percent}% (${loadedFormatted} of ${totalFormatted})...`,
              stage: 'uploading'
            });
          }
        };

        xhr.upload.onload = () => {
          if (uploadCancelledRef.current) return;
          setUploadProgress({
            percent: 100,
            fileName: file.name,
            totalSize: totalSizeFormatted,
            loadedSize: totalSizeFormatted,
            statusText: 'Upload completed! Parsing PDF pages, OCR & extracting NLP structure...',
            stage: 'processing'
          });
        };

        xhr.onabort = () => {
          activeXhrRef.current = null;
          setUploadLoading(false);
          setUploadProgress(null);
        };

        xhr.onload = () => {
          activeXhrRef.current = null;
          if (uploadCancelledRef.current) return;
          setUploadLoading(false);
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const data = JSON.parse(xhr.responseText);
              setInputText(data.text || '');
              setUploadedDocInfo({
                filename: data.filename,
                format: data.format || 'TXT',
                pages: data.pages || 1,
                words: data.words || data.stats?.words || 0
              });
              setUploadProgress({
                percent: 100,
                fileName: file.name,
                totalSize: totalSizeFormatted,
                loadedSize: totalSizeFormatted,
                statusText: `✓ Extracted ${(data.words || 0).toLocaleString()} words from ${data.pages || 1} ${data.pages === 1 ? 'page' : 'pages'}!`,
                stage: 'done'
              });
              showToast(`✓ Ingested ${data.filename} (${(data.words || 0).toLocaleString()} words)`, "success");
              fetchDocuments();
              setActiveTab('summarize');
              setTimeout(() => {
                setUploadProgress(null);
              }, 3200);
            } catch (e) {
              setUploadProgress(null);
              showToast("Failed to parse server response.", "error");
            }
          } else {
            let detail = "Could not extract file text";
            try {
              const errData = JSON.parse(xhr.responseText);
              if (errData.detail) detail = errData.detail;
            } catch (e) {}
            setUploadProgress({
              percent: 0,
              fileName: file.name,
              totalSize: totalSizeFormatted,
              loadedSize: '0 KB',
              statusText: `Error: ${detail}`,
              stage: 'error'
            });
            showToast(detail, "error");
            setTimeout(() => {
              setUploadProgress(null);
            }, 4000);
          }
        };

        xhr.onerror = () => {
          activeXhrRef.current = null;
          if (uploadCancelledRef.current) return;
          setUploadLoading(false);
          setUploadProgress({
            percent: 0,
            fileName: file.name,
            totalSize: totalSizeFormatted,
            loadedSize: '0 KB',
            statusText: "Network error occurred during document upload.",
            stage: 'error'
          });
          showToast("Network error occurred during document upload.", "error");
          setTimeout(() => {
            setUploadProgress(null);
          }, 4000);
        };

        xhr.send(formData);
      };

      // Upload Handler for Camera-Captured Photos with client OCR

      // Ingested Documents Statistics

          fetchDocuments();

              setUploadedDocInfo({

              });

              const displayTitle = title.length > 45 ? `${title.slice(0, 45)}...` : title;
              showToast(`ℹ️ Video "${displayTitle}" detected. Copy transcript from YouTube or paste below.`, "info", 5500);

      const handleSpeak = (text) => {
        if (!text || !text.trim()) return;

        // If audio is currently playing or loading, stop it immediately
        if (isSpeaking || audioLoading) {
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current.currentTime = 0;
            audioRef.current = null;
          }
          if ('speechSynthesis' in window) {

          }
          setIsSpeaking(false);
          setAudioLoading(false);
          return;
        }

        const cleanText = text
          .replace(/[#*_`~>-]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        if (!cleanText) return;

        setAudioLoading(true);

        const playDeviceSpeech = () => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = /[\u0900-\u097F]/.test(cleanText) ? 'hi-IN' : 'en-US';
            window._activeUtterance = utterance;
            utterance.onstart = () => { setIsSpeaking(true); setAudioLoading(false); };
            utterance.onend = () => { setIsSpeaking(false); setAudioLoading(false); window._activeUtterance = null; };
            utterance.onerror = () => { setIsSpeaking(false); setAudioLoading(false); window._activeUtterance = null; };
            window.speechSynthesis.speak(utterance);
          } else {
            setIsSpeaking(false);
            setAudioLoading(false);
            showToast("Speech synthesis is not supported on this browser.", "error");
          }
        };

        try {
          const ttsUrl = `/api/tts?text=${encodeURIComponent(cleanText)}&voice=${encodeURIComponent(selectedVoice)}&_t=${Date.now()}`;
          const audio = new Audio(ttsUrl);
          audioRef.current = audio;

          // Latency safety guard: if network takes > 1200ms to buffer audio, start device speech instantly
          const fallbackTimer = setTimeout(() => {
            if (audioLoading && !isSpeaking) {
              console.warn("Neural voice buffering latency threshold reached, starting instant device speech.");
              if (audioRef.current) {
                audioRef.current.pause();
                audioRef.current = null;
              }
              playDeviceSpeech();
            }
          }, 1200);

          audio.onplaying = () => {
            clearTimeout(fallbackTimer);
            setIsSpeaking(true);
            setAudioLoading(false);
          };

          audio.onplay = () => {
            clearTimeout(fallbackTimer);
            setIsSpeaking(true);
            setAudioLoading(false);
          };

          audio.onended = () => {
            clearTimeout(fallbackTimer);
            setIsSpeaking(false);
            setAudioLoading(false);
            audioRef.current = null;
          };

          audio.onerror = () => {
            clearTimeout(fallbackTimer);
            console.warn("Neural audio stream unavailable, falling back to local speech engine.");
            playDeviceSpeech();
          };

          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch((e) => {
              clearTimeout(fallbackTimer);
              console.warn("Auto-play interaction notice:", e);
              playDeviceSpeech();
            });
          }

          setAudioLoading(false);
